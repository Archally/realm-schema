engineVersion: "0.1"
rules:
  - id: system-without-components
    severity: warn
    description: >-
      A system is the abstraction over the parts that make it up: the heating system is
      its heat pump, its cylinder and its emitters. A system with no component either
      side of the edge is a name with nothing behind it, and it answers no question about
      condition, age, warranty or replacement cost. Components carry `system_ref`, so the
      edge is INCOMING; the system's own `component_refs` is optional and a model may
      legitimately express membership from one side only.
    find:
      entity_type: system
    check:
      any_of:
        - has_relation: { direction: in, type: system, exists: true }
        - has_relation: { direction: out, type: component, exists: true }
    message: 'System "{id}" ({name|''unnamed''}) has no components - nothing records what it is made of.'
