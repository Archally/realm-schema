engineVersion: "0.1"
rules:
  - id: undescribed-authored-entity
    severity: info
    description: >-
      A name says what something is called; a description says what it is, and it is the
      only place the reasoning behind a value survives. An undescribed entity is valid
      YAML and becomes a bare row in every report and viewer the model produces.

      The construction layer is EXCLUDED, and that exclusion is the whole of what makes
      this rule usable. Measured on the worked example: of 51 entities carrying no
      description, all 51 were construction geometry - 43 wall segments, 5 roof planes,
      3 slabs. Every one is derived from the rooms above it rather than authored, so
      prose there would be noise generated to satisfy a rule. Without the exclusion this
      rule reports 51 findings of which zero are actionable, which is how a checker
      teaches people to ignore it.

      Prose is not confined to `description`. The schema gives several types a field of
      their own for exactly this content - a maintenance task carries `instructions`, a
      soil profile `texture_description`, a risk its `mitigation` - and an entity using
      the field its own type provides is documented, not undescribed. The rule reads the
      schema's whole prose vocabulary, and reading a field from a type that does not have
      it simply yields nothing - so one list serves all 39 types without a rule per type.

      What is checked is prose about the RECORD. Prose nested inside a sub-object that
      describes one part of it - the text on an individual change item, on a shade-impact
      assessment, in a notification's message template - does not count, because it says
      what that part is rather than what the entity is.

      Companion to, not a replacement for, a coverage measure: this asks only whether
      prose exists at all, so it stays silent on a description that is a restatement of
      the name.
    find:
      all: true
    filter:
      type_not_in: [wall_segment, roof_plane, floor_slab, ceiling_slab]
    check:
      any_non_empty:
        - data.description
        - data.notes
        - data.summary                  # estate_change
        - data.instructions             # maintenance_task
        - data.rationale                # planting_recommendation
        - data.maintenance_description  # planting_recommendation
        - data.texture_description      # soil_profile
        - data.mitigation               # risk
        - data.current_measures         # issue
        - data.outcome                  # event
        - data.resolution_notes         # shared_concern
        - data.seasonal_variation       # environmental_factor
        - data.pruning_guide.technique  # species_care_profile
    message: '{type} "{id}" ({name|''unnamed''}) has no description or equivalent prose field - it renders as a bare name in reports and viewers.'
