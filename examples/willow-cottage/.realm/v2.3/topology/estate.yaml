# ═════════════════════════════════════════════════════════════════════════════
# Topology: Estate - parcel, buildings, wings, floors, rooms, outdoor zones
#
# Schema: topology/estate.schema.yaml
#
# GENERATED from a layout specification. Areas, elevations, wall segments and
# opening offsets are computed rather than typed, which is why they agree with
# one another. An edit made here is replaced the next time the model is
# generated - copy it before adapting it.
#
# Two coordinate conventions live in this file, and telling them apart is the
# single most useful thing to learn from it:
#
#   position   ABSOLUTE - metres from the model origin.
#   footprint  RELATIVE - metres from that element's own position.
#
# So a building's footprint vertices are small numbers around zero, and moving
# the building means changing one `position`, not every vertex. Boundary
# segments break the pattern deliberately: they have no position of their own,
# so their vertices are absolute (see topology/boundary.yaml).
# ═════════════════════════════════════════════════════════════════════════════

parcels:
  - id: LP001
    name: Willow Cottage smallholding
    cadastral_id: NH-2184
    area_sqm: 1927
    # Shoelace area of the six corners below. Edge lengths, walked from the north:
    #   N->NE: 34.09 m
    #   NE->E: 22.5 m
    #   E->SE: 25.71 m
    #   SE->S: 28.64 m
    #   S->W: 31.83 m
    #   W->N: 24.33 m
    position: {x: 23.55, y: 22.19}
    footprint:
      shape: polygon
      vertices:
        - {x: -23.55, y: -22.19}   # N (abs 0, 0) ground +3.4 m
        - {x: 10.45, y: -19.69}   # NE (abs 34, 2.5) ground +2.8 m
        - {x: 28.45, y: -6.19}   # E (abs 52, 16) ground +1.3 m
        - {x: 22.45, y: 18.81}   # SE (abs 46, 41) ground -1.8 m
        - {x: -5.55, y: 24.81}   # S (abs 18, 47) ground -3 m
        - {x: -27.55, y: 1.81}   # W (abs -4, 24) ground +0.3 m

    # One elevation per footprint vertex, in the same order. A viewer fans the
    # polygon from its centroid and tilts each triangle, so these six numbers are
    # the whole terrain model - there is no separate height grid.
    vertex_elevations: [3.4, 2.8, 1.3, -1.8, -3, 0.3]
    elevation_m: 0.5
    description: >
      Irregular six-sided plot of 1927 m², falling from the lane on the north
      side to the stream at the south. The cottage and barn stand on two cut
      platforms in the upper third; below them the ground steepens through the
      orchard and the terraced vegetable garden before flattening into wet
      meadow.
    tags: [hillside, irregular-plot, stream-boundary]

# ── Buildings ─────────────────────────────────────────────────────────────
buildings:
  - id: BLD001
    name: Willow Cottage
    building_type: house
    parcel_ref: LP001
    wing_refs: [WNG001, WNG002]
    floors_count: 2
    built_year: 1868
    total_area_sqm: 114.6
    position: {x: 19.11, y: 21.33}
    footprint:
      shape: polygon
      vertices:
        - {x: -5.11, y: -5.33}   # abs 14, 16
        - {x: 5.89, y: -5.33}   # abs 25, 16
        - {x: 5.89, y: 2.67}   # abs 25, 24
        - {x: 2.49, y: 2.67}   # abs 21.6, 24
        - {x: 2.49, y: 6.17}   # abs 21.6, 27.5
        - {x: -5.11, y: 6.17}   # abs 14, 27.5
    rotation_degrees: 0
    ground_elevation_m: 0
    exterior_wall_thickness_cm: 30

    # eave and ridge are the MAXIMA over this building's wings, not separate
    # measurements - a building that disagreed with its own wings would be
    # reporting two different roofs.
    eave_height_m: 4.6
    ridge_height_m: 8.2
    description: >
      Two-storey stone cottage with a single-storey rear lean-to, set on a
      levelled terrace cut into the hillside. The terrace is the model's Z
      datum.
    tags: [stone, listed-locally, terraced-platform]
  - id: BLD002
    name: Stone barn
    building_type: garage
    parcel_ref: LP001
    wing_refs: [WNG003]
    floors_count: 1
    built_year: 1890
    total_area_sqm: 42
    position: {x: 33.5, y: 21}
    footprint:
      shape: polygon
      vertices:
        - {x: -3.5, y: -3}   # abs 30, 18
        - {x: 3.5, y: -3}   # abs 37, 18
        - {x: 3.5, y: 3}   # abs 37, 24
        - {x: -3.5, y: 3}   # abs 30, 24
    rotation_degrees: 0
    ground_elevation_m: -1.2
    exterior_wall_thickness_cm: 25

    # eave and ridge are the MAXIMA over this building's wings, not separate
    # measurements - a building that disagreed with its own wings would be
    # reporting two different roofs.
    eave_height_m: 2.9
    ridge_height_m: 5
    description: >
      Detached barn east of the cottage, on its own platform 1.2 m lower.
      Reached from the drive; no internal connection to the house.
    tags: [stone, detached, workshop]

# ── Wings - the shape of a building, and where its roof lives ─────────────
wings:
  - id: WNG001
    name: Cottage main range
    building_ref: BLD001
    footprint:
      shape: polygon
      vertices:
        - {x: -5.11, y: -5.33}   # abs 14, 16
        - {x: 5.89, y: -5.33}   # abs 25, 16
        - {x: 5.89, y: 2.67}   # abs 25, 24
        - {x: -5.11, y: 2.67}   # abs 14, 24
    # Wing vertices are relative to the BUILDING's position, not the wing's own
    # centre - the wings of one building share a frame so their areas can be
    # summed against the building footprint (114.6 m²).
    roof_type: gable
    roof_pitch_degrees: 42
    ridge_direction: E
    eave_height_m: 4.6
    ridge_height_m: 8.2
    roof_overhang_cm: 40
    description: >
      The original two-storey range, 11.0 m along the ridge by 8.0 m deep.
      Gable roof at 42 degrees, ridge running east-west, stone walls 30 cm
      thick.
  - id: WNG002
    name: Rear scullery lean-to
    building_ref: BLD001
    footprint:
      shape: polygon
      vertices:
        - {x: -5.11, y: 2.67}   # abs 14, 24
        - {x: 2.49, y: 2.67}   # abs 21.6, 24
        - {x: 2.49, y: 6.17}   # abs 21.6, 27.5
        - {x: -5.11, y: 6.17}   # abs 14, 27.5
    # Wing vertices are relative to the BUILDING's position, not the wing's own
    # centre - the wings of one building share a frame so their areas can be
    # summed against the building footprint (114.6 m²).
    roof_type: mono-pitch
    roof_pitch_degrees: 15
    eave_height_m: 2.7
    ridge_height_m: 3.9
    roof_overhang_cm: 25
    description: >
      Single-storey lean-to added across the rear elevation, 7.6 m by 3.5 m.
      Mono-pitch roof falling south at 15 degrees. Brick, not stone - later
      work.
  - id: WNG003
    name: Stone barn
    building_ref: BLD002
    footprint:
      shape: polygon
      vertices:
        - {x: -3.5, y: -3}   # abs 30, 18
        - {x: 3.5, y: -3}   # abs 37, 18
        - {x: 3.5, y: 3}   # abs 37, 24
        - {x: -3.5, y: 3}   # abs 30, 24
    # Wing vertices are relative to the BUILDING's position, not the wing's own
    # centre - the wings of one building share a frame so their areas can be
    # summed against the building footprint (42 m²).
    roof_type: gable
    roof_pitch_degrees: 35
    ridge_direction: E
    eave_height_m: 2.9
    ridge_height_m: 5
    roof_overhang_cm: 30
    description: >
      Detached barn, 7.0 m by 6.0 m, standing 1.2 m below the cottage terrace
      on the natural fall of the ground. One open bay, used as garaging and
      workshop.

