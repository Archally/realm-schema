# ═════════════════════════════════════════════════════════════════════════════
# Estate changes - work that is planned but not yet part of the model
#
# Schema: estate-change.schema.yaml
#
# GENERATED from a layout specification. Areas, elevations, wall segments and
# opening offsets are computed rather than typed, which is why they agree with
# one another. An edit made here is replaced the next time the model is
# generated - copy it before adapting it.
#
# A change is the TO-BE beside the AS-IS. Each `changes[]` entry names the
# action, the entity and the two states, so a plan can be read against the
# model it will alter rather than as prose about intentions.
#
# The entity was called `migration` until 2.2.0; a model written against 2.1
# needs the rename before it validates here.
# ═════════════════════════════════════════════════════════════════════════════

estate_changes:
  - id: ECH001
    name: Rebuild the bulging section of the east wall
    status: approved
    priority: high
    proposed_date: "2026-02-20"
    planned_start_date: "2026-10-05"
    planned_end_date: "2026-10-16"
    affected_entity_refs: [BS003]
    affected_zone_refs: [OZ004]
    coordinator_ref: PRS001
    estimated_cost: 2400
    currency: GBP
    changes:
    - action: replace
      entity_type: boundary_segment
      entity_ref: BS003
      description: >
        Take down and rebuild the six metres nearest the south end.
      from_state: >
        Dry stone wall leaning about 120 mm over 1.5 m of height
      to_state: >
        Rebuilt on the original line, reusing the stone
    description: >
      Take down and rebuild the six metres nearest the south end, which has
      moved since the wet winter. The stone is reusable; the wall is the
      boundary with The Old Forge, so the neighbour is told before work
      starts.
    tags: [structural, boundary]
  - id: ECH002
    name: Extend rainwater harvesting to the barn roof
    status: proposed
    priority: low
    proposed_date: "2026-06-11"
    affected_entity_refs: [SYS004, BLD002]
    affected_zone_refs: [OZ007]
    depends_on_estate_change_refs: [ECH001]
    estimated_cost: 900
    currency: GBP
    changes:
    - action: modify
      entity_type: system
      entity_ref: SYS004
      description: >
        Add a second tank on the barn's south slope, cross-linked to the first.
      from_state: >
        3000 litres, cottage north slope only
      to_state: >
        5000 litres across two linked tanks
    description: >
      Second tank taking the barn's south slope, cross-linked to the existing
      one. Deferred behind the wall rebuild, which needs the same access along
      the orchard edge.
    tags: [water, garden]
  - id: ECH003
    name: Add garden gazebo, enlarge front lawn, and transplant borders
    status: approved
    priority: medium
    proposed_date: "2026-07-05"
    planned_start_date: "2026-10-20"
    planned_end_date: "2026-10-30"
    affected_entity_refs: [BLD003, WNG004, OZ002, PTG007, PTG003]
    affected_zone_refs: [OZ002, OZ005]
    coordinator_ref: PRS001
    estimated_cost: 4800
    currency: GBP
    changes:
    - action: add
      entity_type: building
      entity_ref: BLD003
      description: >
        Erect a 4 m by 3 m open timber gazebo on the upper front lawn.
      from_state: >
        Open turf in the middle of the front garden
      to_state: >
        Timber garden gazebo BLD003 (12 m²) at (5.5, 11.5) on a 1.45 m datum pad
      effect:
        after:
          id: BLD003
          name: Garden gazebo
          building_type: gazebo
          parcel_ref: LP001
          wing_refs:
            - WNG004
          floors_count: 1
          total_area_sqm: 12
          position:
            x: 5.5
            y: 11.5
          footprint:
            shape: polygon
            vertices:
              - x: -2
                y: -1.5
              - x: 2
                y: -1.5
              - x: 2
                y: 1.5
              - x: -2
                y: 1.5
          rotation_degrees: 0
          ground_elevation_m: 1.45
          eave_height_m: 2.3
          ridge_height_m: 3.1
          description: Open-sided timber gazebo set on a small level pad in the front garden.
          tags:
            - gazebo
            - timber
            - garden
    - action: add
      entity_type: wing
      entity_ref: WNG004
      description: >
        Single pitched-roof pavilion wing composing the garden gazebo.
      from_state: >
        No structure on the pad
      to_state: >
        Timber gazebo wing WNG004 (4 m by 3 m, hip roof to 3.1 m ridge)
      effect:
        after:
          id: WNG004
          name: Gazebo pavilion
          building_ref: BLD003
          footprint:
            shape: polygon
            vertices:
              - x: -2
                y: -1.5
              - x: 2
                y: -1.5
              - x: 2
                y: 1.5
              - x: -2
                y: 1.5
          roof_type: hip
          roof_pitch_degrees: 28
          ridge_direction: E
          eave_height_m: 2.3
          ridge_height_m: 3.1
          roof_overhang_cm: 35
          description: Single 4.0 m by 3.0 m open timber pavilion wing under a hipped shingle roof.
    - action: modify
      entity_type: outdoor_zone
      entity_ref: OZ002
      description: >
        Extend the south edge of the front lawn by two metres to open space
        around the gazebo.
      from_state: >
        Front lawn 210 m² ending along y = 16 m
      to_state: >
        Front lawn 242 m² extending south to y = 18 m
      effect:
        property_changes:
          - kind: set
            property: area_sqm
            old_value: 210
            value: 242
          - kind: set
            property: footprint.vertices
            old_value:
              - x: -6.32
                y: -7.18
              - x: 7.52
                y: -7.18
              - x: 7.52
                y: 6.82
              - x: -8.65
                y: 6.82
            value:
              - x: -6.32
                y: -7.18
              - x: 7.52
                y: -7.18
              - x: 7.52
                y: 8.82
              - x: -8.65
                y: 8.82
    - action: relocate
      entity_type: planting
      entity_ref: PTG007
      description: >
        Lift and replant the cottage border two metres south along the new lawn
        edge.
      from_state: >
        Cottage border at (11.5, 14.5) in OZ002
      to_state: >
        Cottage border relocated to (11.5, 16.5) along the extended south edge
        of OZ002
      effect:
        property_changes:
          - kind: set
            property: position
            old_value:
              x: 11.5
              y: 14.5
            value:
              x: 11.5
              y: 16.5
    - action: relocate
      entity_type: planting
      entity_ref: PTG003
      description: >
        Transplant the herb strip to the sunnier south-east bed of the vegetable
        garden.
      from_state: >
        Herb strip at (21, 32.3) in OZ005
      to_state: >
        Herb strip transplanted to (22.5, 35.5) in OZ005
      effect:
        property_changes:
          - kind: set
            property: position
            old_value:
              x: 21
              y: 32.3
            value:
              x: 22.5
              y: 35.5
    description: >
      Executable future-estate plan adding a timber garden gazebo in the front
      garden, extending the front lawn southward by two metres, and
      transplanting the cottage border and herb strip with explicit
      coordinates.
    tags: [gazebo, lawn, planting, to-be]
