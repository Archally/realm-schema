# ── Roads ─────────────────────────────────────────────────────────────────
roads:
  - id: RD001  # public-docs-scan:allow - RD is the Road Corridor prefix, not a decision id
    name: Brackwater Lane
    surface_type: asphalt
    width_m: 4
    is_public: true
    direction: E

    # A road is a 3D polyline: the z of each vertex is ground level along the
    # road against this model's datum, so a lane above the plot reads as above it.
    centerline:
      vertices:
        - {x: -12, y: -3.6, z: 4.3}
        - {x: 0, y: -2.6, z: 3.6}
        - {x: 34, y: -0.2, z: 3}
        - {x: 58, y: 1.6, z: 2.5}
    borders_neighbor_refs: [NP001]
    description: >
      Single-track lane with passing places, running along the top of the
      plot. The gate opens onto it 4 m east of the north corner.
    tags: [single-track, public]
  - id: RD002  # public-docs-scan:allow - RD is the Road Corridor prefix, not a decision id
    name: Mill Farm track
    surface_type: gravel
    width_m: 3
    is_public: false
    direction: S

    # A road is a 3D polyline: the z of each vertex is ground level along the
    # road against this model's datum, so a lane above the plot reads as above it.
    centerline:
      vertices:
        - {x: 55, y: 1.2, z: 2.6}
        - {x: 56.5, y: 20, z: 0.9}
        - {x: 54, y: 44, z: -2.4}
    borders_neighbor_refs: [NP002, NP003]
    description: >
      Private farm track east of the stone wall, carrying occasional tractor
      traffic to the meadow.
    tags: [private, agricultural]

# ── Environmental factors - what the site does to itself ──────────────────
environmental_factors:
  - id: EF001
    name: South-westerly prevailing wind
    factor_type: prevailing-wind
    direction: SW
    intensity: moderate
    seasonal_variation: >
      Strongest between October and February.
    affected_zone_refs: [OZ005, OZ006]
    description: >
      Open fetch across the meadow, so the vegetable garden needs the hedge on
      its south-west corner.
    tags: [wind]
  - id: EF002
    name: Frost pocket in the lower meadow
    factor_type: frost-pocket
    direction: S
    intensity: high
    seasonal_variation: >
      Late frosts persist here two to three weeks past the rest of the plot.
    affected_zone_refs: [OZ006, OZ004]
    description: >
      Cold air drains down the 6.4 m fall and settles at the stream, which is
      why the orchard stops short of the meadow.
    tags: [cold-air-drainage, slope]
  - id: EF003
    name: Erosion on the south-west bank
    factor_type: erosion-risk
    direction: SW
    intensity: moderate
    seasonal_variation: >
      Worst after heavy rain from November to March.
    affected_zone_refs: [OZ005]
    description: >
      The steepest part of the fall crosses the vegetable garden; the terrace
      risers wash out where they are not planted.
    tags: [erosion, slope]

# ── Shared concerns ───────────────────────────────────────────────────────
shared_concerns:
  - id: SC001
    name: Coppice overhanging the drive
    concern_type: overhanging-branches
    neighbor_property_ref: NP004
    severity: moderate
    status: discussed
    affected_boundary_segment_ref: BS005
    affected_zone_ref: OZ001
    description: >
      Hazel from the coppice reaches over the drive and drips onto parked
      cars. The owner has agreed to cut back at the next rotation.
    tags: [vegetation]
