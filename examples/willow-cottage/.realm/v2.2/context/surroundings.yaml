# ═════════════════════════════════════════════════════════════════════════════
# Context: Surroundings - neighbours, roads, environment, shared concerns
#
# Schema: context/surroundings.schema.yaml
#
# GENERATED from a layout specification. Areas, elevations, wall segments and
# opening offsets are computed rather than typed, which is why they agree with
# one another. An edit made here is replaced the next time the model is
# generated - copy it before adapting it.
#
# A neighbour is modelled as land first and a building second.
# `parcel_footprint` and `parcel_vertex_elevations` describe the ground -
# which is what decides whether they look down on you, where their water goes,
# and what they shade - while `footprint` plus the roof fields are only enough
# massing to cast a shadow. Neighbouring land is drawn flat here because its
# level is known and its shape is not; the estate's own parcel gets six real
# corner elevations.
#
# Everything is stated in THIS model's frame: a neighbour's
# `ground_elevation_offset_m` is metres above the cottage threshold, not above
# sea level and not relative to their own ground.
# ═════════════════════════════════════════════════════════════════════════════

neighbor_properties:
  - id: NP001
    name: Hollybank (north-east)
    direction: NE
    cadastral_id: NH-2183
    property_type: residential-single
    distance_from_boundary_m: 9.5
    occupancy: permanent
    noise_level: quiet
    household_count: 1
    position: {x: 49, y: -1}

    # The neighbour's land: 988 m², relative to the position above.
    parcel_footprint:
      shape: polygon
      vertices:
        - {x: -19, y: -13}
        - {x: 19, y: -13}
        - {x: 19, y: 13}
        - {x: -19, y: 13}
    parcel_vertex_elevations: [3.1, 3.1, 3.1, 3.1]
    ground_elevation_offset_m: 3.1

    # Building massing - enough to cast a shadow, not a model of their house.
    footprint:
      shape: polygon
      vertices:
        - {x: -9, y: -7}
        - {x: 1, y: -7}
        - {x: 1, y: 1}
        - {x: -9, y: 1}
    building_stories: 2
    building_height_m: 7.6
    eave_height_m: 4.4
    roof_type: gable
