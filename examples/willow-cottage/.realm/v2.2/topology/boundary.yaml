# ═════════════════════════════════════════════════════════════════════════════
# Topology: Boundary - what encloses the plot, run by run
#
# Schema: topology/boundary.schema.yaml
#
# GENERATED from a layout specification. Areas, elevations, wall segments and
# opening offsets are computed rather than typed, which is why they agree with
# one another. An edit made here is replaced the next time the model is
# generated - copy it before adapting it.
#
# Boundary vertices are ABSOLUTE model coordinates. Everything else in the
# topology plane places itself with a `position` and then describes its shape
# relative to that; a boundary has no centre worth naming, so it does not.
#
# Each run here spans two parcel corners, so the five segments close the
# hexagon exactly and their vertices are the corners themselves.
# ═════════════════════════════════════════════════════════════════════════════

