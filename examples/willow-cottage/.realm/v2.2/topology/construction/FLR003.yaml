# The room on the right owns it; the room on the far side is `left_space_ref`.
# A door in it is one opening carrying both `source_room_ref` and
# `connects_to_ref` - not two doors in one wall.
#
# All coordinates are model-absolute. Elevations are metres above the vertical
# datum, so this floor's slab sits at -1.2 m and its walls rise 2.8 m from
