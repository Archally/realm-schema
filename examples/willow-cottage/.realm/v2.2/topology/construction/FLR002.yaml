# east-to-west, W south-to-north - and it is the same circuit the semantic
# layer measures `wall_offset_cm` along, so an opening's offset carries over
# unchanged.
#
# An interior wall is declared by both rooms it divides but exists ONCE here.
# The room on the right owns it; the room on the far side is `left_space_ref`.
# A door in it is one opening carrying both `source_room_ref` and
# `connects_to_ref` - not two doors in one wall.
#
# All coordinates are model-absolute. Elevations are metres above the vertical
# datum, so this floor's slab sits at 2.85 m and its walls rise 2.35 m from
# there.
