---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "topology/estate.schema.yaml"
title: "Estate Topology"
description: >
  Physical containment hierarchy of the estate: land parcels, buildings,
  floors, rooms, and outdoor zones. Models the spatial structure from
  land ownership down to individual rooms and garden areas. Topology plane.

x-gdsm:
  version: "2.0.0"
  methodology: "GDSM v1.0"
  plane: "topology"
  domain_slice: null
  designed_for:
    - id: T2
      name: "Property Inventory Report"
      mfs_target: 85
    - id: T5
      name: "2D Spatial Layout Visualization"
      mfs_target: 80
  competency_questions:
    - "CQ01: What land parcels, buildings, and outdoor zones does this estate comprise?"
    - "CQ02: How many rooms does a given building have, what floor are they on, and what is each room's purpose?"
    - "CQ03: Which outdoor zone is classified as garden vs. forest vs. driveway vs. parking?"
    - "CQ26: What are the openings (windows, doors), lighting fixtures, and heating details for each room?"
    - "CQ33: What is the wall structure (thickness, material, adjacency) of each room, and where exactly are openings placed on each wall?"
    - "CQ34: What are the building heights (eave, ridge) for shadow and elevation analysis?"
  fitness:
    last_evaluated: "2026-03-08"
    scores: {}
  non_goals:
    - "Detailed insulation layer specs (R-value, individual layers)"
    - "Interior design (furniture, finishes)"
    - "Legal ownership records (deeds, title documents)"
  status: draft
  owned_by: null
  schema_ref_prefix: "LP, BLD, WNG, FLR, RM, OZ"
  design_notes: >
    v2.0: Wing entity required for every building. Roof fields live exclusively
    on wings. Building eave/ridge heights are DERIVED (agent-computed max across
    wings). 3D elevation fields added to parcel, building, floor, boundary.
    Opening enriched with head_height, depth, swing_direction for construction
    inference.

type: object
additionalProperties: false
properties:
  parcels:
    type: array
    title: "Land Parcels"
    description: "Land parcels comprising this estate. Answers CQ01."
    items:
      $ref: "#/$defs/parcel"
  buildings:
    type: array
    title: "Buildings"
    description: "All buildings on the estate. Answers CQ01, CQ02."
    items:
      $ref: "#/$defs/building"
  wings:
    type: array
    title: "Wings"
    description: >
      Structural sections of buildings. Every building has at least one wing.
      Simple rectangular buildings have exactly one wing. Complex buildings
      (L-shaped, T-shaped) are decomposed into multiple wings. Roof geometry
      lives exclusively on wings.
    items:
      $ref: "#/$defs/wing"
    minItems: 1
  floors:
    type: array
    title: "Floors"
    description: "All floors across all buildings. Answers CQ02."
    items:
      $ref: "#/$defs/floor"
  rooms:
    type: array
    title: "Rooms"
    description: "All rooms across all floors. Answers CQ02."
    items:
      $ref: "#/$defs/room"
  outdoor_zones:
    type: array
    title: "Outdoor Zones"
    description: "All outdoor areas. Answers CQ03."
    items:
      $ref: "#/$defs/outdoor_zone"

$defs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Parcel — LP###
  # ═══════════════════════════════════════════════════════════════════════════

  parcel:
    type: object
    title: "Land Parcel"
    description: >
      A discrete area of land with legal/cadastral identity. An estate may
      comprise multiple parcels (e.g., main lot + adjacent forest plot).
      Answers CQ01 (what parcels exist). Used by T2 (inventory) and T5 (layout).
    required: [id, name]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "LP### Identifier"
        description: "Unique typed identifier for this land parcel."
        pattern: "^([a-z][a-z0-9-]*\\.)?LP\\d{3,}$"
        examples: ["LP001", "forest.LP002"]
      name:
        type: string
        title: "Parcel Name"
        description: "Human-readable name for this parcel."
        minLength: 1
        examples: ["Main Lot", "Forest Plot"]
      cadastral_id:
        type: string
        title: "Cadastral ID"
        description: "Official land registry / cadastral identifier."
        examples: ["12345/6", "Gemarkung Musterstadt, Flurstück 42/1"]
      area_sqm:
        type: number
        title: "Area (m²)"
        description: "Total area of this parcel in square meters."
        exclusiveMinimum: 0
        examples: [2500, 8000]
      position:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "Centroid Position"
        description: "Center position of this parcel on the property layout."
      footprint:
        $ref: "../metamodel.schema.yaml#/$defs/polygon_footprint"
        title: "Parcel Boundary"
        description: "Polygon outline of the parcel boundary. Used by T5 for rendering."
      # ── Elevation (v2.0) ──
      elevation_m:
        type: number
        title: "Ground Elevation (m)"
        description: >
          Ground elevation of this parcel above the vertical datum. For flat
          properties using local-ground datum, typically 0. For sea-level-
          relative datum, the actual meters above sea level (e.g., 153).
          Multiple parcels may have different elevations on sloped terrain.
        default: 0
        examples: [0, 153, 0.5]
      vertex_elevations:
        type: array
        title: "Per-Vertex Elevations (m)"
        description: >
          Per-vertex elevation (m, relative to model vertical datum / origin)
          for each vertex of `footprint`. Length must equal
          `footprint.vertices.length`. When present, the 3D viewer renders
          the parcel as a fan-triangulated tilted surface (centroid +
          adjacent vertices form coplanar triangles — no GPU bilinear fold).
          Vertex order matches `footprint.vertices`.
        items:
          type: number
        examples: [[0, 4.8, 1.6, -5.08]]
      description:
        type: string
        title: "Description"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Building — BLD###
  # ═══════════════════════════════════════════════════════════════════════════

  building:
    type: object
    title: "Building"
    description: >
      A roofed structure on the estate: house, guest house, garage, shed,
      workshop, greenhouse, or barn. Contains floors and rooms. Answers
      CQ01 (estate composition) and CQ02 (room inventory). Used by T2, T5.
    required: [id, name, building_type, parcel_ref, wing_refs]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "BLD### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?BLD\\d{3,}$"
        examples: ["BLD001", "main.BLD001"]
      name:
        type: string
        title: "Building Name"
        minLength: 1
        examples: ["Main House", "Guest House", "Double Garage"]
      building_type:
        type: string
        title: "Building Type"
        description: "Primary classification of this building."
        enum:
          - "house"
          - "guest-house"
          - "garage"
          - "shed"
          - "gazebo"
          - "workshop"
          - "greenhouse"
          - "barn"
          - "carport"
          - "pool-house"
          - "sauna"
        examples: ["house"]
      parcel_ref:
        $ref: "../metamodel.schema.yaml#/$defs/parcel_ref"
        title: "Parcel"
        description: "Land parcel this building sits on."
      wing_refs:
        type: array
        title: "Wing References"
        description: >
          Wings composing this building's structure. Every building must have
          at least one wing. Simple rectangular buildings have exactly one wing.
          Redundant with wing.building_ref but enables per-building enforcement.
        items:
          $ref: "../metamodel.schema.yaml#/$defs/wing_ref"
        minItems: 1
        uniqueItems: true
      floors_count:
        type: integer
        title: "Number of Floors"
        description: "Total number of floors including basement and attic if present."
        minimum: 1
        examples: [2, 3]
      built_year:
        type: integer
        title: "Year Built"
        description: "Year the building was constructed."
        examples: [1995, 2020]
      total_area_sqm:
        type: number
        title: "Total Floor Area (m²)"
        description: "Sum of all floor areas in this building."
        exclusiveMinimum: 0
        examples: [180, 45]
      position:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "Centroid Position"
        description: "Center of the building footprint on the property grid."
      footprint:
        $ref: "../metamodel.schema.yaml#/$defs/polygon_footprint"
        title: "Building Footprint"
        description: "Ground-plan polygon in local coordinates (before rotation)."
      rotation_degrees:
        type: number
        title: "Rotation (degrees)"
        description: >
          Clockwise rotation from north in degrees. Applied to the footprint
          polygon vertices around the centroid for 2D rendering. 0 means the
          building's local +Y axis aligns with north.
        default: 0
        minimum: 0
        exclusiveMaximum: 360
        examples: [0, 15.5, 45]
      # ── 3D Geometry (v2.0) ──
      ground_elevation_m:
        type: number
        title: "Ground Elevation (m)"
        description: >
          Elevation of the building's ground level above the vertical datum.
          Default 0 for flat terrain. Non-zero for buildings on slopes or
          raised foundations. Used by construction inference for floor
          stacking and 3D placement.
        default: 0
        examples: [0, 0.3, -0.5]
      anchor_point:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "Anchor Point"
        description: >
          Stable reference point for this building's geometry. Typically the
          south-west exterior corner of the ground-floor footprint. Unlike
          position (centroid), anchor_point does not move when the footprint
          is edited. Used by construction inference as placement origin.
          Optional — when absent, position (centroid) is used.
      exterior_wall_thickness_cm:
        type: number
        title: "Exterior Wall Thickness (cm)"
        description: >
          Typical exterior wall thickness for this building (structure +
          insulation). Used by construction inference to calculate interior
          envelope from exterior footprint.
        exclusiveMinimum: 0
        examples: [24, 30, 38]
      # ── Derived Heights (v2.0 — computed from wings) ──
      eave_height_m:
        type: number
        title: "Eave Height (m)"
        description: >
          DERIVED FIELD — maximum eave height across all wings of this building.
          Computed by inference agent. Used for quick LOD0/LOD1 site plan
          rendering without reading individual wing data. Optional — omit
          if wings are the sole consumer.
        exclusiveMinimum: 0
        examples: [3.0, 2.5]
      ridge_height_m:
        type: number
        title: "Ridge Height (m)"
        description: >
          DERIVED FIELD — maximum ridge height across all wings of this building.
          Computed by inference agent. Used for quick LOD0/LOD1 site plan
          rendering without reading individual wing data. Optional — omit
          if wings are the sole consumer.
        exclusiveMinimum: 0
        examples: [7.2, 5.0]
      description:
        type: string
      # ── Equipment and furniture (shed, gazebo — no formal rooms) ──
      equipment_refs:
        type: array
        title: "Equipment References"
        description: >
          Equipment placed in this building (shed, gazebo). Used when the
          building has no formal rooms. Redundant with equipment.building_ref.
        items:
          $ref: "../metamodel.schema.yaml#/$defs/equipment_ref"
      furniture_refs:
        type: array
        title: "Furniture References"
        description: >
          Furniture placed in this building (shed, gazebo). Used when the
          building has no formal rooms. Redundant with furniture.building_ref.
        items:
          $ref: "../metamodel.schema.yaml#/$defs/furniture_ref"
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Wing — WNG###
  # ═══════════════════════════════════════════════════════════════════════════

  wing:
    type: object
    title: "Wing"
    description: >
      A structural section of a building with its own footprint and roof
      geometry. Every building has at least one wing. Simple rectangular
      buildings have exactly one wing. Complex buildings (L-shaped, T-shaped,
      with attached garage) are decomposed into multiple wings. Each wing has
      independent roof type, pitch, and height data. Roof fields live
      exclusively on wings — not on buildings. Rooms and construction
      entities reference their wing via wing_ref.
    required: [id, name, building_ref, footprint]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "WNG### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?WNG\\d{3,}$"
        examples: ["WNG001", "main.WNG001"]
      name:
        type: string
        title: "Wing Name"
        minLength: 1
        examples: ["Bryła główna", "Skrzydło garażowe", "Main Body", "Garage Wing"]
      building_ref:
        $ref: "../metamodel.schema.yaml#/$defs/building_ref"
        title: "Parent Building"
        description: "Building this wing belongs to."

      # ── Footprint ──
      footprint:
        $ref: "../metamodel.schema.yaml#/$defs/polygon_footprint"
        title: "Wing Footprint"
        description: >
          Outline of this wing in building-local coordinates (before rotation).
          The union of all wing footprints should approximate the building footprint.
      position:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "Wing Centroid"
        description: "Center of this wing for labeling."

      # ── Roof ──
      roof_type:
        type: string
        title: "Roof Type"
        description: "Primary roof form for this wing."
        enum:
          - "flat"
          - "gable"
          - "hip"
          - "gambrel"
          - "mansard"
          - "shed"
          - "mono-pitch"
        examples: ["gable"]
      roof_pitch_degrees:
        type: number
        title: "Roof Pitch (degrees)"
        minimum: 0
        maximum: 90
        examples: [35, 25]
      ridge_direction:
        $ref: "../metamodel.schema.yaml#/$defs/compass_direction"
        title: "Ridge Direction"
        description: "Compass direction the ridge runs (parallel to)."
      eave_height_m:
        type: number
        title: "Eave Height (m)"
        exclusiveMinimum: 0
        examples: [3.0, 2.5]
      ridge_height_m:
        type: number
        title: "Ridge Height (m)"
        exclusiveMinimum: 0
        examples: [7.2, 5.0]
      roof_overhang_cm:
        type: number
        title: "Roof Overhang (cm)"
        minimum: 0
        examples: [40, 30]

      # ── Elevation override ──
      ground_elevation_m:
        type: number
        title: "Ground Elevation (m)"
        description: >
          Ground level of this wing above vertical datum, if different from
          building.ground_elevation_m. For split-level or stepped buildings.
        examples: [0, 0.3]

      description:
        type: string
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Floor — FLR###
  # ═══════════════════════════════════════════════════════════════════════════

  floor:
    type: object
    title: "Floor"
    description: >
      A storey or level within a building. Level 0 = ground floor,
      negative = basement, positive = upper floors. Answers CQ02 (rooms
      per floor). Used by T2 (inventory).
    required: [id, name, level, building_ref]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "FLR### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?FLR\\d{3,}$"
        examples: ["FLR001"]
      name:
        type: string
        title: "Floor Name"
        minLength: 1
        examples: ["Ground Floor", "First Floor", "Basement"]
      level:
        type: integer
        title: "Level Number"
        description: "0 = ground, -1 = basement, 1 = first floor, etc."
        examples: [0, 1, -1]
      building_ref:
        $ref: "../metamodel.schema.yaml#/$defs/building_ref"
        title: "Building"
        description: "Building this floor belongs to."
      area_sqm:
        type: number
        title: "Floor Area (m²)"
        exclusiveMinimum: 0
        examples: [90, 60]
      ceiling_height_m:
        type: number
        title: "Ceiling Height (m)"
        exclusiveMinimum: 0
        examples: [2.6, 2.4]
      # ── Elevation (v2.0) ──
      base_elevation_m:
        type: number
        title: "Base Elevation (m)"
        description: >
          Elevation of the bottom of this floor's slab above the vertical
          datum. Typically: ground_floor = building.ground_elevation_m,
          upper floors = previous floor's base + slab + clear height.
        examples: [0, 2.8, -2.5]
      finished_floor_elevation_m:
        type: number
        title: "Finished Floor Elevation (m)"
        description: >
          Elevation of the walking surface (top of slab + finish).
          Used to place rooms and furniture in 3D.
        examples: [0.15, 3.0, -2.3]
      slab_thickness_cm:
        type: number
        title: "Slab Thickness (cm)"
        description: "Structural slab thickness including finish."
        exclusiveMinimum: 0
        examples: [20, 25, 30]
      # ── Wing association (v2.0) ──
      wing_ref:
        $ref: "../metamodel.schema.yaml#/$defs/wing_ref"
        title: "Wing"
        description: >
          Structural wing this floor belongs to. Required when the parent
          building has multiple wings. Optional for single-wing buildings
          (inferred from the sole wing). Omit for floors spanning the
          entire building across wing boundaries.
      # ── Outline (v2.0) ──
      footprint:
        $ref: "../metamodel.schema.yaml#/$defs/polygon_footprint"
        title: "Floor Outline"
        description: >
          Floor plan outline in building-local coordinates. May differ from
          building footprint for partial floors (e.g., basement doesn't extend
          under garage). When absent, inherited from building (or wing) footprint.
      description:
        type: string
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Room — RM###
  # ═══════════════════════════════════════════════════════════════════════════

  room:
    type: object
    title: "Room"
    description: >
      An indoor space within a floor, classified by purpose. Answers CQ02
      (room purpose and area), CQ26 (openings, lighting, heating detail).
      Used by T2 (inventory).
    required: [id, name, room_type, floor_ref]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "RM### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?RM\\d{3,}$"
        examples: ["RM001", "main-house.RM012"]
      name:
        type: string
        title: "Room Name"
        minLength: 1
        examples: ["Master Bedroom", "Kitchen", "Utility Room"]
      room_type:
        type: string
        title: "Room Type"
        description: "Primary purpose of this room."
        enum:
          - "bedroom"
          - "bathroom"
          - "kitchen"
          - "living-room"
          - "dining-room"
          - "office"
          - "utility"
          - "storage"
          - "hallway"
          - "staircase"
          - "attic"
          - "cellar"
          - "workshop"
          - "laundry"
          - "garage-bay"
          - "pantry"
          - "dressing-room"
          - "server-room"
          - "boiler-room"
          - "terrace"
        examples: ["bedroom"]
      floor_ref:
        $ref: "../metamodel.schema.yaml#/$defs/floor_ref"
        title: "Floor"
        description: "Floor this room is on."
      area_sqm:
        type: number
        title: "Room Area (m²)"
        exclusiveMinimum: 0
        examples: [18.5, 12]
      # ── Dimensions (v1.1) ──
      width_cm:
        type: number
        title: "Width (cm)"
        description: "Interior width (shorter axis) in centimeters."
        exclusiveMinimum: 0
        examples: [320, 195]
      length_cm:
        type: number
        title: "Length (cm)"
        description: "Interior length (longer axis) in centimeters."
        exclusiveMinimum: 0
        examples: [518, 303]
      ceiling_height_cm:
        type: number
        title: "Ceiling Height (cm)"
        description: "Floor-to-ceiling height in centimeters."
        exclusiveMinimum: 0
        examples: [260, 280]
      position:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "Room Position"
        description: "Center of the room on the building floor plan grid. Used by T5."
      footprint:
        $ref: "../metamodel.schema.yaml#/$defs/polygon_footprint"
        title: "Room Footprint"
        description: "Floor-plan polygon in local coordinates (before translation by position). Used by T5."
      rotation_degrees:
        type: number
        title: "Rotation (degrees)"
        description: "Clockwise rotation from north. Most rooms are axis-aligned (0)."
        minimum: 0
        maximum: 360
        default: 0
        examples: [0, 90]
      # ── Wing association (v2.0) ──
      wing_ref:
        $ref: "../metamodel.schema.yaml#/$defs/wing_ref"
        title: "Wing"
        description: >
          Structural wing this room belongs to. Can be inferred from floor's
          wing_ref for single-wing buildings. Explicit when a floor spans
          multiple wings (e.g., hallway connecting main body and garage wing).
      # ── Wall structure (v1.5) ──
      walls:
        type: object
        title: "Wall Structure"
        description: >
          Axis-aligned wall definitions for this room. Keys are compass
          directions (N, E, S, W). Optional — omit for models without
          wall-level detail. Answers CQ33.
        additionalProperties: false
        properties:
          N:
            $ref: "#/$defs/room_wall"
          E:
            $ref: "#/$defs/room_wall"
          S:
            $ref: "#/$defs/room_wall"
          W:
            $ref: "#/$defs/room_wall"
      # ── Legacy fields (v1.0, kept for backward compat) ──
      window_count:
        type: integer
        title: "Number of Windows"
        description: "Simple window count. Superseded by openings[] in v1.1."
        minimum: 0
        examples: [2, 0]
      window_orientation:
        $ref: "../metamodel.schema.yaml#/$defs/compass_direction"
        title: "Primary Window Orientation"
        description: "Compass direction the main windows face. Superseded by openings[] in v1.1."
      has_water:
        type: boolean
        title: "Has Water Supply"
        description: "Whether this room has plumbed water (relevant for bathrooms, kitchen, utility)."
      has_heating:
        type: boolean
        title: "Has Heating"
        description: "Whether this room has a heating element. Superseded by heating in v1.1."
      # ── Cross-references to equipment and furniture (v1.1) ──
      equipment_refs:
        type: array
        title: "Equipment References"
        description: >
          Equipment entities placed in this room. Redundant with equipment.room_ref
          but improves human readability of room definitions.
        items:
          $ref: "../metamodel.schema.yaml#/$defs/equipment_ref"
      furniture_refs:
        type: array
        title: "Furniture References"
        description: >
          Furniture entities placed in this room. Redundant with furniture.room_ref
          but improves human readability of room definitions.
        items:
          $ref: "../metamodel.schema.yaml#/$defs/furniture_ref"
      # ── Openings (v1.1) ──
      openings:
        type: array
        title: "Openings"
        description: "Windows, doors, and other openings in this room. Answers CQ26."
        items:
          $ref: "#/$defs/opening"
      # ── Lighting (v1.1) ──
      lighting_groups:
        type: array
        title: "Lighting Groups"
        description: >
          Lighting fixture groups in this room, each independently switched.
          Answers CQ26.
        items:
          $ref: "#/$defs/lighting_group"
      # ── Heating detail (v1.1) ──
      heating:
        $ref: "#/$defs/room_heating"
        title: "Heating"
        description: "Structured heating details for this room."
      description:
        type: string
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Opening (embedded, v1.1)
  # ═══════════════════════════════════════════════════════════════════════════

  opening:
    type: object
    title: "Opening"
    description: >
      A window, door, or other opening in a room wall. Embedded sub-object
      (no ID). Tracks type, wall, dimensions, and operability. Answers CQ26.
    required: [opening_type, wall]
    additionalProperties: false
    properties:
      opening_type:
        type: string
        title: "Opening Type"
        enum:
          - "window"
          - "door"
          - "terrace-door"
          - "french-door"
          - "sliding-door"
          - "skylight"
          - "garage-door"
        examples: ["window"]
      wall:
        $ref: "../metamodel.schema.yaml#/$defs/compass_direction"
        title: "Wall"
        description: "Wall where this opening is located."
      width_cm:
        type: number
        title: "Width (cm)"
        description: "Opening width including frame/recess."
        exclusiveMinimum: 0
        examples: [182, 80]
      height_cm:
        type: number
        title: "Height (cm)"
        description: "Opening height including frame/recess."
        exclusiveMinimum: 0
        examples: [217, 202]
      sill_height_cm:
        type: number
        title: "Sill Height (cm)"
        description: "Height of window sill above floor. 0 for floor-to-ceiling."
        minimum: 0
        examples: [90, 0]
      wall_offset_cm:
        type: number
        title: "Wall Offset (cm)"
        description: >
          Distance from the clockwise start of the wall to the opening's
          near edge, in centimeters. Convention: N wall starts at NW corner
          (left-to-right), E wall at NE corner (top-to-bottom), S wall at
          SE corner (right-to-left), W wall at SW corner (bottom-to-top).
          Omit for models without precise opening placement.
        minimum: 0
        examples: [60, 120, 200]
      panes:
        type: integer
        title: "Number of Panes"
        description: "Number of separate glass panes or wings."
        minimum: 1
        examples: [2, 3]
      openable:
        type: boolean
        title: "Openable"
        description: "Whether this opening can be opened (false = fixed glazing)."
      opens_inward:
        type: boolean
        title: "Opens Inward"
        description: "True if opens inward, false if opens outward."
      glazing:
        type: string
        title: "Glazing Type"
        enum: ["single", "double", "triple"]
        examples: ["double"]
      opens_to_room_ref:
        $ref: "../metamodel.schema.yaml#/$defs/room_ref"
        title: "Opens To Room"
        description: "For doors: the room on the other side. Omit for exterior doors/windows."
      opens_to_zone_ref:
        $ref: "../metamodel.schema.yaml#/$defs/outdoor_zone_ref"
        title: "Opens To Zone"
        description: "For exterior doors: the outdoor zone on the other side."
      # ── 3D Enrichment (v2.0) ──
      head_height_cm:
        type: number
        title: "Head Height (cm)"
        description: >
          Height of the opening's top edge (lintel/head) above floor level.
          Can be derived as sill_height_cm + height_cm, but explicit value
          prevents rounding errors in construction inference.
        exclusiveMinimum: 0
        examples: [210, 260]
      depth_cm:
        type: number
        title: "Reveal Depth (cm)"
        description: >
          Depth of the wall reveal (window/door recess) in centimeters.
          Typically equals wall thickness. Used for 3D opening cutout depth.
        exclusiveMinimum: 0
        examples: [24, 30]
      swing_direction:
        type: string
        title: "Swing Direction"
        description: >
          For hinged doors: which direction the door swings when opening.
          Combines with opens_inward to fully describe the door arc.
        enum: ["left", "right"]
        examples: ["left"]
      description:
        type: string

  # ═══════════════════════════════════════════════════════════════════════════
  # Lighting Group (embedded, v1.1)
  # ═══════════════════════════════════════════════════════════════════════════

  lighting_group:
    type: object
    title: "Lighting Group"
    description: >
      A group of lighting fixtures controlled by the same switch. Tracks
      fixture type, bulb specifications, wattage, and switching. Answers CQ26.
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        title: "Group Name"
        minLength: 1
        examples: ["Halogeny sufitowe", "Lampy wiszące nad wyspą", "LED pod szafkami"]
      fixture_count:
        type: integer
        title: "Number of Fixtures"
        minimum: 1
        examples: [4, 2, 1]
      fixture_type:
        type: string
        title: "Fixture Type"
        enum:
          - "recessed-spot"
          - "surface-spot"
          - "pendant"
          - "chandelier"
          - "wall-sconce"
          - "led-strip"
          - "track"
          - "floor-lamp"
          - "table-lamp"
          - "under-cabinet"
          - "range-hood-light"
          - "mirror-light"
          - "other"
        examples: ["recessed-spot"]
      adjustable:
        type: boolean
        title: "Adjustable / Directional"
        description: "Whether fixtures are directional (tiltable/rotatable spots)."
      bulb_socket:
        type: string
        title: "Bulb Socket"
        description: "Socket type for replaceable bulbs. Omit for integrated LED."
        enum: ["GU10", "E27", "E14", "G9", "GX53", "MR16", "integrated"]
        examples: ["GU10"]
      bulb_type:
        type: string
        title: "Bulb Type"
        enum: ["LED", "halogen", "fluorescent", "incandescent", "CFL"]
        examples: ["halogen"]
      wattage_per_bulb:
        type: number
        title: "Wattage per Bulb (W)"
        exclusiveMinimum: 0
        examples: [50, 7]
      total_wattage:
        type: number
        title: "Total Group Wattage (W)"
        description: "Total wattage of all fixtures in this group."
        exclusiveMinimum: 0
        examples: [200, 14]
      color_temperature_k:
        type: integer
        title: "Color Temperature (K)"
        description: "Correlated color temperature in Kelvin."
        minimum: 1800
        maximum: 10000
        examples: [2700, 4000]
      dimmable:
        type: boolean
        title: "Dimmable"
      switch_type:
        type: string
        title: "Switch Type"
        enum:
          - "wall-switch"
          - "dimmer"
          - "remote"
          - "smart"
          - "pull-cord"
          - "motion-sensor"
          - "integrated"
        examples: ["wall-switch"]
      switch_location:
        type: string
        title: "Switch Location"
        description: "Where the switch is located (e.g., wall by door, combined with other group)."
        examples: ["Przy drzwiach wejściowych", "Wspólny z halogenami"]
      description:
        type: string

  # ═══════════════════════════════════════════════════════════════════════════
  # Room Heating (embedded, v1.1)
  # ═══════════════════════════════════════════════════════════════════════════

  room_heating:
    type: object
    title: "Room Heating"
    description: >
      Structured heating details for a room: type(s), location, and link
      to infrastructure system/component.
    additionalProperties: false
    properties:
      has_underfloor:
        type: boolean
        title: "Has Underfloor Heating"
      radiator_type:
        type: string
        title: "Radiator Type"
        description: "Type of radiator if present. Omit if no radiator."
        enum:
          - "panel-radiator"
          - "towel-radiator"
          - "convector"
          - "fan-coil"
          - "electric-heater"
          - "stove"
        examples: ["panel-radiator"]
      radiator_wall:
        $ref: "../metamodel.schema.yaml#/$defs/compass_direction"
        title: "Radiator Wall"
        description: "Wall where the radiator is mounted."
      system_ref:
        $ref: "../metamodel.schema.yaml#/$defs/system_ref"
        title: "Heating System"
        description: "Infrastructure heating system serving this room."
      component_ref:
        $ref: "../metamodel.schema.yaml#/$defs/component_ref"
        title: "Radiator Component"
        description: "Specific radiator component in the infrastructure model."
      description:
        type: string

  # ═══════════════════════════════════════════════════════════════════════════
  # Room Wall (embedded, v1.5)
  # ═══════════════════════════════════════════════════════════════════════════

  room_wall:
    type: object
    title: "Room Wall"
    description: >
      Wall segment of a room. Each room has up to 4 axis-aligned walls (N, E, S, W).
      Tracks thickness, exterior status, adjacency, and material. Shared interior
      walls are declared by both rooms — redundancy enables cross-validation.
      Answers CQ33. Used by T5 for wall-thickness rendering.
    required: [thickness_cm, is_exterior]
    additionalProperties: false
    properties:
      thickness_cm:
        type: number
        title: "Wall Thickness (cm)"
        description: "Structural thickness of this wall in centimeters."
        exclusiveMinimum: 0
        examples: [24, 12, 15]
      is_exterior:
        type: boolean
        title: "Is Exterior Wall"
        description: "True if this wall faces outside the building envelope."
      adjacent_ref:
        $ref: "../metamodel.schema.yaml#/$defs/room_or_zone_ref"
        title: "Adjacent Space"
        description: >
          Room or outdoor zone on the other side of this wall. Omit for
          exterior walls facing open areas without a defined zone.
      material:
        type: string
        title: "Wall Material"
        description: "Primary structural material of this wall."
        examples: ["gazobeton", "karton-gips", "beton", "cegła"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Outdoor Zone — OZ###
  # ═══════════════════════════════════════════════════════════════════════════

  outdoor_zone:
    type: object
    title: "Outdoor Zone"
    description: >
      A classified outdoor area within a parcel: garden bed, lawn, forest
      section, driveway, patio, etc. Answers CQ03 (zone classification)
      and CQ11 (planting suitability). Used by T2, T3, T5.
    required: [id, name, zone_type, parcel_ref]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "OZ### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?OZ\\d{3,}$"
        examples: ["OZ001", "garden.OZ003"]
      name:
        type: string
        title: "Zone Name"
        minLength: 1
        examples: ["Front Garden", "Back Lawn", "North Forest", "Driveway"]
      zone_type:
        type: string
        title: "Zone Type"
        description: "Primary classification of this outdoor area."
        enum:
          - "garden"
          - "vegetable-garden"
          - "orchard"
          - "forest"
          - "lawn"
          - "meadow"
          - "driveway"
          - "parking"
          - "patio"
          - "terrace"
          - "deck"
          - "pool-area"
          - "playground"
          - "greenhouse-area"
          - "compost-area"
          - "woodshed-area"
          - "utility-area"
        examples: ["garden"]
      parcel_ref:
        $ref: "../metamodel.schema.yaml#/$defs/parcel_ref"
        title: "Parcel"
        description: "Land parcel this zone belongs to."
      area_sqm:
        type: number
        title: "Zone Area (m²)"
        exclusiveMinimum: 0
        examples: [120, 500]
      position:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "Centroid Position"
      footprint:
        $ref: "../metamodel.schema.yaml#/$defs/footprint"
        title: "Zone Outline"
        description: "Shape of this zone on the property layout. Polygon for irregular areas, circle for round features."
      sun_exposure:
        type: string
        title: "Sun Exposure"
        description: "Typical sun exposure level. Answers CQ11, CQ22. Used by T3 (garden planning)."
        enum: ["full-sun", "partial-sun", "partial-shade", "full-shade"]
        examples: ["partial-sun"]
      soil_type:
        type: string
        title: "Soil Type"
        description: "Dominant soil type in this zone. Affects plant selection (CQ11)."
        enum: ["clay", "loam", "sandy-loam", "sand", "silt", "peat", "chalk", "rocky"]
        examples: ["loam"]
      soil_ph:
        type: number
        title: "Soil pH"
        description: "Measured or estimated soil pH. Affects plant compatibility."
        minimum: 3
        maximum: 10
        examples: [6.5]
      # ── Detailed Soil Profiles (v1.6) ──
      soil_profile_refs:
        type: array
        title: "Soil Profiles"
        description: >
          Detailed soil profiles for this zone. One zone may have multiple
          soil profiles (e.g., lawn area vs raised bed). Answers CQ37.
          Convenience reverse-ref; SOIL entity is primary owner via outdoor_zone_ref.
        items:
          $ref: "../metamodel.schema.yaml#/$defs/soil_profile_ref"
        uniqueItems: true
      slope_direction:
        $ref: "../metamodel.schema.yaml#/$defs/compass_direction"
        title: "Slope Direction"
        description: "Direction the ground slopes downward (for drainage analysis)."
      slope_percent:
        type: number
        title: "Slope (%)"
        description: "Gradient as percentage. 0 = flat, 100 = 45 degrees."
        minimum: 0
        examples: [3, 0]
      description:
        type: string
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
