---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "migration.schema.yaml"
title: "Realm Migration"
description: >
  Tracks planned property changes as AS-IS → TO-BE transitions. Each
  migration represents a discrete change (add solar panels, replace fence,
  plant new hedge) with timeline, status, dependencies, impact on
  existing entities, and required resources (tools, materials, equipment).
  Follows the Blueprint migration pattern.

x-gdsm:
  version: "1.4.0"
  methodology: "GDSM v1.0"
  plane: null
  domain_slice: null
  designed_for:
    - id: T8
      name: "Migration Planning Report"
      mfs_target: 80
  competency_questions:
    - "CQ23: What changes are planned for the property, what is their timeline, and what is their current status?"
    - "CQ31: What tools, materials, and equipment are required for each migration, what quantities are needed, and what is their availability?"
  fitness:
    last_evaluated: "2026-03-14"
    scores: {}
  non_goals:
    - "Detailed resource scheduling (who uses what tool when) — only preparatory checklists"
    - "Contractor bidding and selection"
    - "Permit application tracking"
  status: draft
  owned_by: null
  schema_ref_prefix: "MIG"

type: object
additionalProperties: false
properties:
  migrations:
    type: array
    title: "Migrations"
    description: "Planned property changes tracking AS-IS to TO-BE transitions. Answers CQ23."
    items:
      $ref: "#/$defs/migration"

$defs:
  migration:
    type: object
    title: "Migration"
    description: >
      A planned property change with lifecycle tracking. Moves through
      statuses from proposed → approved → in-progress → completed or
      cancelled. Answers CQ23, CQ31. Used by T8 (migration planning report).
    required: [id, name, status]
    additionalProperties: false
    patternProperties:
      "^x-":
        description: "Extension fields for domain-specific scheduling metadata (seasonal windows, risk/issue linkage)."
    properties:
      id:
        type: string
        title: "MIG### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?MIG\\d{3,}$"
        examples: ["MIG001"]
      name:
        type: string
        title: "Migration Name"
        minLength: 1
        examples: ["Install Rooftop Solar Array", "Replace North Fence", "Plant Privacy Hedge"]
      summary:
        type: string
        title: "Summary"
        description: "One-paragraph description of the planned change."
        examples: ["Install 10kWp solar PV system on south-facing roof of main house with battery storage"]
      status:
        type: string
        title: "Status"
        description: "Current lifecycle state of this migration."
        enum:
          - "proposed"
          - "approved"
          - "scheduled"
          - "in-progress"
          - "completed"
          - "cancelled"
          - "deferred"
        examples: ["proposed"]
      priority:
        type: string
        title: "Priority"
        enum: ["critical", "high", "medium", "low"]
        examples: ["high"]
      # ── Timeline ──
      proposed_date:
        $ref: "metamodel.schema.yaml#/$defs/iso_date"
        title: "Date Proposed"
      planned_start_date:
        $ref: "metamodel.schema.yaml#/$defs/iso_date"
        title: "Planned Start"
      planned_end_date:
        $ref: "metamodel.schema.yaml#/$defs/iso_date"
        title: "Planned Completion"
      actual_start_date:
        $ref: "metamodel.schema.yaml#/$defs/iso_date"
        title: "Actual Start"
      actual_end_date:
        $ref: "metamodel.schema.yaml#/$defs/iso_date"
        title: "Actual Completion"
      # ── Changes ──
      changes:
        type: array
        title: "Entity Changes"
        description: >
          Specific changes to realm entities: add, modify, replace, or
          remove systems, zones, plantings, boundaries, etc.
        items:
          type: object
          title: "Change"
          required: [action, entity_type]
          additionalProperties: false
          properties:
            action:
              type: string
              title: "Action"
              enum: ["add", "modify", "replace", "remove", "relocate"]
              examples: ["add"]
            entity_type:
              type: string
              title: "Entity Type"
              description: "Type of entity being changed."
              examples: ["system", "boundary_segment", "planting", "building", "outdoor_zone"]
            entity_ref:
              type: string
              title: "Entity Reference"
              description: "ID of the existing entity being modified/replaced/removed."
              examples: ["SYS001", "BS003"]
            description:
              type: string
              title: "Change Description"
              examples: ["Add 10kWp solar PV system on main house roof"]
            from_state:
              type: string
              title: "From State (AS-IS)"
              description: "Current state before the change."
              examples: ["No solar generation"]
            to_state:
              type: string
              title: "To State (TO-BE)"
              description: "Desired state after the change."
              examples: ["10kWp solar PV with 13.5kWh battery"]
      # ── Required Resources (v1.4) ──
      required_resources:
        type: array
        title: "Required Resources"
        description: >
          Tools, materials, and equipment needed to execute this migration.
          Drives preparatory checklist generation (PDF) and purchase
          planning. Answers CQ31.
        items:
          $ref: "#/$defs/required_resource"
      # ── Impact ──
      affected_system_refs:
        type: array
        title: "Affected Systems"
        description: "Existing systems impacted by this migration."
        items:
          $ref: "metamodel.schema.yaml#/$defs/system_ref"
        uniqueItems: true
      affected_zone_refs:
        type: array
        title: "Affected Zones"
        items:
          $ref: "metamodel.schema.yaml#/$defs/outdoor_zone_ref"
        uniqueItems: true
      # ── Dependencies ──
      depends_on_migration_refs:
        type: array
        title: "Dependencies"
        description: "Migrations that must be completed before this one can start."
        items:
          type: string
          pattern: "^([a-z][a-z0-9-]*\\.)?MIG\\d{3,}$"
        uniqueItems: true
        examples: [["MIG001"]]
      # ── Coordinator (v1.4) ──
      coordinator_ref:
        $ref: "metamodel.schema.yaml#/$defs/person_ref"
        title: "Coordinator"
        description: "Person responsible for coordinating this migration. Answers CQ32."
      # ── Cost ──
      estimated_cost:
        type: number
        title: "Estimated Cost"
        minimum: 0
        examples: [15000, 2500]
      currency:
        type: string
        title: "Currency"
        pattern: "^[A-Z]{3}$"
        examples: ["EUR"]
      description:
        type: string
      tags:
        $ref: "metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Required Resource (v1.4) — checklist item for migration preparation
  # ═══════════════════════════════════════════════════════════════════════════

  required_resource:
    type: object
    title: "Required Resource"
    description: >
      A tool, material, or piece of equipment needed to execute a migration.
      Supports optional references to existing TL or EQP entities for
      inventory cross-checking. Used for deterministic PDF checklist
      generation and purchase planning. Answers CQ31.
    required: [name, category, availability]
    additionalProperties: false
    properties:
      name:
        type: string
        title: "Resource Name"
        description: "Human-readable name of the required resource."
        minLength: 1
        examples: ["Spawarka MIG/MAG", "Beton B20", "Taczka"]
      category:
        type: string
        title: "Resource Category"
        description: "Classification for checklist grouping."
        enum:
          - "tool"
          - "material"
          - "equipment"
      availability:
        type: string
        title: "Availability Status"
        description: "Whether this resource is available on-site or needs to be acquired."
        enum:
          - "on-site"
          - "to-purchase"
          - "to-check"
          - "to-borrow"
          - "to-rent"
      quantity:
        type: number
        title: "Quantity"
        description: "Amount needed. Omit for items where quantity is implicit (e.g., 1 ladder)."
        exclusiveMinimum: 0
        examples: [17, 650, 2000]
      unit:
        type: string
        title: "Unit"
        description: "Unit of measurement for quantity (e.g., szt., kg, l, m, m²)."
        minLength: 1
        examples: ["szt.", "kg", "l", "m", "m²"]
      tool_ref:
        $ref: "metamodel.schema.yaml#/$defs/tool_ref"
        title: "Tool Reference"
        description: "Reference to an existing TL### entity in the tool inventory."
      equipment_ref:
        $ref: "metamodel.schema.yaml#/$defs/equipment_ref"
        title: "Equipment Reference"
        description: "Reference to an existing EQP### entity in the equipment inventory."
      estimated_cost:
        type: number
        title: "Estimated Cost"
        description: "Estimated acquisition cost for items that need purchasing."
        minimum: 0
        examples: [250, 50]
      currency:
        type: string
        title: "Currency"
        pattern: "^[A-Z]{3}$"
        examples: ["PLN"]
      notes:
        type: string
        title: "Notes"
        description: "Where to buy, specifications, alternatives, or other preparation notes."
        examples: ["Leroy Merlin, 2× big bag", "W garażu RM012"]
