---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "nature/vegetation.schema.yaml"
title: "Vegetation"
description: >
  Individual plant specimens (significant trees, notable shrubs) and categorical
  planting groups (hedges, flower beds, lawns). Tracks species, botanical needs,
  spatial placement, and watering requirements. Nature plane.

x-gdsm:
  version: "2.0.0"
  methodology: "GDSM v1.0"
  plane: "nature"
  domain_slice: null
  designed_for:
    - id: T2
      name: "Property Inventory Report"
      mfs_target: 85
    - id: T3
      name: "Garden Planning Advisory"
      mfs_target: 80
    - id: T5
      name: "2D Spatial Layout Visualization"
      mfs_target: 80
    - id: T10
      name: "Seasonal Garden Care Calendar"
      mfs_target: 85
  competency_questions:
    - "CQ09: What individual specimen plants/trees exist, where are they positioned, and what area do they occupy?"
    - "CQ10: What categorical plantings exist in each zone, what species, and what are their aggregate watering needs?"
    - "CQ11: How should plants in a zone be organized given climate, sun exposure, and companion compatibility?"
    - "CQ28: What is the growth trajectory of specimens and when will plantings reach target screening height?"
    - "CQ35: What care activities are needed for each plant species in each month? (via care_profile_ref → SCP)"
    - "CQ38: What pest/disease threats affect each species and what is the protection protocol? (via care_profile_ref → SCP)"
    - "CQ39: When and how should each species be pruned? (via care_profile_ref → SCP)"
  fitness:
    last_evaluated: "2026-03-15"
    scores: {}
  non_goals:
    - "Comprehensive botanical taxonomy (just species name + common name)"
    - "Current health state tracking per individual plant (external store; see SCP for protocols)"
    - "Harvest yield tracking"
  status: draft
  owned_by: null
  schema_ref_prefix: "SPM, PTG"

type: object
additionalProperties: false
properties:
  specimens:
    type: array
    title: "Specimens"
    description: "Individual plants and trees. Answers CQ09."
    items:
      $ref: "#/$defs/specimen"
  plantings:
    type: array
    title: "Plantings"
    description: "Categorical planting groups. Answers CQ10, CQ11."
    items:
      $ref: "#/$defs/planting"

$defs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Specimen — SPM###
  # ═══════════════════════════════════════════════════════════════════════════

  specimen:
    type: object
    title: "Specimen"
    description: >
      An individual plant or tree significant enough to track independently.
      Large trees are spatial landmarks with canopy radius. Answers CQ09
      (identity, position, area). Used by T2 (inventory), T3 (garden planning),
      T5 (spatial layout — rendered as circle with canopy_radius_m).
    required: [id, name, specimen_type, outdoor_zone_ref]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "SPM### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?SPM\\d{3,}$"
        examples: ["SPM001"]
      name:
        type: string
        title: "Specimen Name"
        minLength: 1
        examples: ["Old Oak by the Pond", "Japanese Maple at Entrance"]
      specimen_type:
        type: string
        title: "Specimen Type"
        description: "Growth form classification."
        enum:
          - "tree-deciduous"
          - "tree-evergreen"
          - "tree-fruit"
          - "shrub-deciduous"
          - "shrub-evergreen"
          - "shrub-fruit"
          - "perennial"
          - "climber"
          - "bamboo"
          - "palm"
        examples: ["tree-deciduous"]
      species:
        type: string
        title: "Species (Latin)"
        description: "Botanical species name."
        examples: ["Quercus robur", "Acer palmatum"]
      common_name:
        type: string
        title: "Common Name"
        examples: ["English Oak", "Japanese Maple"]
      # ── Dimensions ──
      height_m:
        type: number
        title: "Current Height (m)"
        exclusiveMinimum: 0
        examples: [12, 3.5]
      canopy_radius_m:
        type: number
        title: "Canopy Radius (m)"
        description: >
          Radius of the canopy circle in meters. Used by T5 to render
          the specimen as a circle centered on its position. Answers CQ09
          (area occupied by the tree).
        exclusiveMinimum: 0
        examples: [5, 2.5]
      trunk_diameter_cm:
        type: number
        title: "Trunk Diameter (cm)"
        description: "Diameter at breast height (DBH). Relevant for protected tree classification."
        exclusiveMinimum: 0
        examples: [45, 15]
      # ── 3D Canopy (v2.0) ──
      crown_bottom_height_m:
        type: number
        title: "Crown Bottom Height (m)"
        description: >
          Height of the bottom of the canopy above ground (clear trunk height).
          Used for 3D canopy placement — the canopy sphere/ellipsoid starts here.
          Example: a tree with height_m=12 and crown_bottom_height_m=4 has an
          8m tall canopy starting 4m above ground.
        minimum: 0
        examples: [4, 2, 0.5]
      trunk_height_m:
        type: number
        title: "Trunk Height (m)"
        description: >
          Height of the visible trunk from ground to first major branch.
          May differ from crown_bottom_height_m if branches extend below canopy.
        exclusiveMinimum: 0
        examples: [3, 1.5]
      canopy_shape:
        type: string
        title: "Canopy Shape"
        description: >
          Approximate 3D shape of the canopy for rendering. Determines which
          geometry primitive the 3D viewer uses.
        enum:
          - "sphere"          # Round canopy (default for deciduous)
          - "ellipsoid-tall"  # Taller than wide (poplar, cypress)
          - "ellipsoid-wide"  # Wider than tall (spreading oak)
          - "cone"            # Conical (spruce, fir)
          - "column"          # Narrow column (Lombardy poplar, thujas)
          - "umbrella"        # Flat-topped (Scots pine, acacia)
          - "weeping"         # Drooping (willow, birch)
          - "irregular"       # No standard shape
        default: "sphere"
        examples: ["cone"]
      # ── Growth & Condition (v1.3) ──
      growth_rate_cm_per_year:
        type: number
        title: "Growth Rate (cm/year)"
        description: "Average annual height growth rate. Answers CQ28."
        exclusiveMinimum: 0
        examples: [50, 30]
      mature_height_m:
        type: number
        title: "Mature Height (m)"
        description: "Expected final height at maturity. Answers CQ28."
        exclusiveMinimum: 0
        examples: [20, 4]
      height_measured_date:
        $ref: "../metamodel.schema.yaml#/$defs/iso_date"
        title: "Height Measured Date"
        description: "Date when height_m was last measured."
      condition:
        type: string
        title: "Condition"
        description: "Current botanical health condition."
        enum: ["healthy", "stressed", "damaged", "recovering", "dead", "dormant"]
        examples: ["healthy"]
      # ── Lifecycle ──
      planted_date:
        $ref: "../metamodel.schema.yaml#/$defs/iso_date"
        title: "Date Planted"
        description: "When this specimen was planted (or estimated if pre-existing)."
      estimated_age_years:
        type: integer
        title: "Estimated Age (years)"
        minimum: 0
        examples: [80, 5]
      is_protected:
        type: boolean
        title: "Legally Protected"
        description: "Whether this tree/plant is under legal protection (heritage tree, etc.)."
      # ── Botanical Needs ──
      sun_requirement:
        type: string
        title: "Sun Requirement"
        description: "Light needs for healthy growth. Used by T3 (garden planning)."
        enum: ["full-sun", "partial-sun", "partial-shade", "full-shade"]
        examples: ["partial-sun"]
      water_requirement:
        type: string
        title: "Water Requirement"
        description: "Irrigation needs. Used by T3."
        enum: ["drought-tolerant", "low", "moderate", "high"]
        examples: ["low"]
      hardiness_zone_min:
        type: string
        title: "Minimum Hardiness Zone"
        description: "Coldest zone this specimen tolerates."
        pattern: "^\\d{1,2}[ab]$"
        examples: ["5a"]
      leaf_retention:
        type: string
        title: "Leaf Retention"
        description: "Deciduous (drops leaves) or evergreen. Affects year-round screening."
        enum: ["deciduous", "evergreen", "semi-evergreen"]
      bloom_months:
        type: array
        title: "Bloom Months"
        description: "Months when this specimen flowers (1-12)."
        items:
          type: integer
          minimum: 1
          maximum: 12
        uniqueItems: true
        examples: [[4, 5]]
      # ── Spatial ──
      outdoor_zone_ref:
        $ref: "../metamodel.schema.yaml#/$defs/outdoor_zone_ref"
        title: "Located in Zone"
        description: "Outdoor zone where this specimen grows."
      position:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "Position"
        description: "Center of this specimen on the property grid."
      # ── Companion Planting ──
      companion_specimen_refs:
        type: array
        title: "Companion Plants"
        description: "Other specimens that benefit from proximity. Used by T3."
        items:
          $ref: "../metamodel.schema.yaml#/$defs/specimen_ref"
        uniqueItems: true
      antagonist_specimen_refs:
        type: array
        title: "Antagonist Plants"
        description: "Specimens that should be kept distant. Used by T3."
        items:
          $ref: "../metamodel.schema.yaml#/$defs/specimen_ref"
        uniqueItems: true
      # ── Care Profile (v1.6) ──
      care_profile_ref:
        $ref: "../metamodel.schema.yaml#/$defs/care_profile_ref"
        title: "Care Profile"
        description: "Species-level care protocol for this specimen. Answers CQ35, CQ38, CQ39."
      description:
        type: string
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Planting — PTG###
  # ═══════════════════════════════════════════════════════════════════════════

  planting:
    type: object
    title: "Planting"
    description: >
      A categorical group of plants: a hedge row, flower bed, lawn section,
      vegetable bed, or mixed border. Tracks species, count, aggregate
      area, and care schedule. Answers CQ10 (species, watering needs per zone)
      and CQ11 (organization). Used by T2, T3.
    required: [id, name, planting_type, outdoor_zone_ref]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "PTG### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?PTG\\d{3,}$"
        examples: ["PTG001"]
      name:
        type: string
        title: "Planting Name"
        minLength: 1
        examples: ["South Hedge", "Herb Spiral", "Front Flower Bed"]
      planting_type:
        type: string
        title: "Planting Type"
        description: "Category of this planting group."
        enum:
          - "hedge"
          - "flower-bed"
          - "vegetable-bed"
          - "herb-garden"
          - "ground-cover"
          - "lawn"
          - "meadow-section"
          - "mixed-border"
          - "raised-bed"
          - "container-group"
          - "climbing-wall"
          - "green-roof"
        examples: ["hedge"]
      species:
        type: string
        title: "Primary Species"
        description: "Dominant species in this planting (for monoculture groups)."
        examples: ["Buxus sempervirens", "Lavandula angustifolia"]
      common_name:
        type: string
        title: "Common Name"
        examples: ["Boxwood", "English Lavender"]
      species_mix:
        type: array
        title: "Species Mix"
        description: "Multiple species in this planting (for mixed borders, meadows)."
        items:
          type: object
          required: [species]
          additionalProperties: false
          properties:
            species:
              type: string
              examples: ["Lavandula angustifolia"]
            common_name:
              type: string
              examples: ["English Lavender"]
            proportion_percent:
              type: number
              minimum: 0
              maximum: 100
              examples: [30]
      count:
        type: integer
        title: "Plant Count"
        description: "Number of individual plants in this group."
        minimum: 1
        examples: [24, 6]
      area_sqm:
        type: number
        title: "Area (m²)"
        exclusiveMinimum: 0
        examples: [15, 3.5]
      # ── Density & Maturity (v1.3) ──
      spacing_cm:
        type: number
        title: "Plant Spacing (cm)"
        description: "Distance between individual plants. Answers CQ28."
        exclusiveMinimum: 0
        examples: [60, 100]
      current_height_min_cm:
        type: number
        title: "Shortest Plant (cm)"
        description: "Height of the shortest plant in the group."
        exclusiveMinimum: 0
        examples: [200]
      current_height_max_cm:
        type: number
        title: "Tallest Plant (cm)"
        description: "Height of the tallest plant in the group."
        exclusiveMinimum: 0
        examples: [350]
      target_height_m:
        type: number
        title: "Target Height (m)"
        description: "Desired final height (for hedges, privacy screens). Answers CQ28."
        exclusiveMinimum: 0
        examples: [3.5, 4.0]
      age_years:
        type: number
        title: "Age (years)"
        description: "Approximate age of the planting."
        minimum: 0
        examples: [8, 1]
      species_confirmed:
        type: boolean
        title: "Species Confirmed"
        description: "Whether species identification has been verified in the field."
      # ── Needs ──
      sun_requirement:
        type: string
        title: "Sun Requirement"
        enum: ["full-sun", "partial-sun", "partial-shade", "full-shade"]
      water_requirement:
        type: string
        title: "Water Requirement"
        enum: ["drought-tolerant", "low", "moderate", "high"]
      watering_schedule:
        $ref: "../metamodel.schema.yaml#/$defs/rrule_schedule"
        title: "Watering Schedule"
        description: "Recurring watering schedule. Typically active in summer months only."
      season:
        type: string
        title: "Active Season"
        description: "When this planting is actively growing or visible."
        enum: ["spring", "summer", "autumn", "winter", "year-round"]
        examples: ["year-round"]
      # ── Spatial ──
      outdoor_zone_ref:
        $ref: "../metamodel.schema.yaml#/$defs/outdoor_zone_ref"
        title: "Located in Zone"
      position:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "Centroid Position"
      footprint:
        $ref: "../metamodel.schema.yaml#/$defs/footprint"
        title: "Planting Footprint"
        description: "Shape of this planting area on the layout."
      # ── 3D Rendering (v2.0) ──
      height_m:
        type: number
        title: "Planting Height (m)"
        description: >
          Current height of this planting group for 3D rendering.
          For hedges, the maintained height. Derived from
          current_height_min_cm/max_cm average / 100 if not explicitly set.
        exclusiveMinimum: 0
        examples: [2.5, 0.3, 1.8]
      render_as:
        type: string
        title: "3D Render Style"
        description: "How this planting should appear in 3D scenes."
        enum:
          - "extruded-polygon"  # Hedge, raised bed — footprint extruded to height
          - "ground-cover"      # Lawn, ground cover — textured ground plane
          - "point-cloud"       # Flower bed — individual plant dots
          - "row"               # Hedge row — linear extrusion along polyline
        default: "extruded-polygon"
      # ── Care Profile (v1.6) ──
      care_profile_ref:
        $ref: "../metamodel.schema.yaml#/$defs/care_profile_ref"
        title: "Care Profile"
        description: "Species-level care protocol for this planting. Answers CQ35, CQ38, CQ39."
      description:
        type: string
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
