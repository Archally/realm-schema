---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "context/persons.schema.yaml"
title: "Persons & Organizations"
description: >
  People and organizations involved with the property: owners, household
  members, contractors, service providers. Each person is a first-class
  entity with typed ID. Referenced from migrations (coordinator),
  maintenance tasks, warranties, and optionally from neighbor properties.
  Context plane.

x-gdsm:
  version: "1.4.0"
  methodology: "GDSM v1.0"
  plane: "context"
  domain_slice: null
  designed_for:
    - id: T8
      name: "Migration Planning Report"
      mfs_target: 80
    - id: T2
      name: "Property Inventory Report"
      mfs_target: 85
  competency_questions:
    - "CQ32: Who is responsible for coordinating each migration, and how can they be contacted?"
  fitness:
    last_evaluated: "2026-03-14"
    scores: {}
  non_goals:
    - "Personal data beyond name, role, and basic contact (GDPR scope)"
    - "Employment history or qualifications"
    - "Financial relationships (invoices, payment history)"
  status: draft
  owned_by: null
  schema_ref_prefix: "PRS"

type: object
additionalProperties: false
properties:
  persons:
    type: array
    title: "Persons"
    description: "People and organizations involved with the property. Answers CQ32."
    items:
      $ref: "#/$defs/person"

$defs:
  person:
    type: object
    title: "Person"
    description: >
      A person or organization involved with the property: owner,
      household member, contractor, service provider. Can be referenced
      as migration coordinator or maintenance assignee. Answers CQ32.
    required: [id, name]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "PRS### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?PRS\\d{3,}$"
        examples: ["PRS001"]
      name:
        type: string
        title: "Name"
        description: "Full name of person or organization name."
        minLength: 1
        examples: ["Jan Kowalski", "ElektroSerwis Sp. z o.o."]
      person_type:
        type: string
        title: "Person Type"
        description: "Role category in relation to the property."
        enum:
          - "owner"
          - "household-member"
          - "contractor"
          - "service-provider"
          - "neighbor"
          - "other"
        examples: ["owner"]
      company:
        type: string
        title: "Company"
        description: "Company or organization name (for contractors, service providers)."
        examples: ["ElektroSerwis Sp. z o.o."]
      role:
        type: string
        title: "Role"
        description: "Free-text role description."
        examples: ["właściciel", "elektryk", "ogrodnik", "spawacz"]
      email:
        type: string
        title: "Email"
        format: email
        examples: ["jan@example.com"]
      phone:
        type: string
        title: "Phone"
        description: "Phone number in international or local format."
        examples: ["+48 123 456 789"]
      description:
        type: string
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
