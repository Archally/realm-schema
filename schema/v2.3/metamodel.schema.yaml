  # ═══════════════════════════════════════════════════════════════════════════
  # Polymorphic Reference Types
  # ═══════════════════════════════════════════════════════════════════════════

  any_entity_ref:
    type: string
    title: "Any Entity Reference"
    description: >
      Reference to an entity of any type, for fields that deliberately
      accept a cross-plane mix. Estate Change ids carry an optional trailing
      letter addressing one member of a change family; every other prefix
      is digits only.
    pattern: "^([a-z][a-z0-9-]*\\.)?([A-Z]{2,4}\\d{3,}|ECH\\d{3,}[a-z])$"
    examples: ["SPM020", "NP001", "ECH009a"]

  positioned_element_ref:
    title: "Positioned Element Reference"
    description: >
      Reference to any element that can have a spatial position on the
      property layout. Used in spatial_relation from/to fields.
    anyOf:
      - $ref: "#/$defs/parcel_ref"
      - $ref: "#/$defs/building_ref"
      - $ref: "#/$defs/outdoor_zone_ref"
      - $ref: "#/$defs/boundary_segment_ref"
      - $ref: "#/$defs/specimen_ref"
      - $ref: "#/$defs/system_ref"
      - $ref: "#/$defs/component_ref"
      - $ref: "#/$defs/network_node_ref"
      - $ref: "#/$defs/iot_device_ref"
      - $ref: "#/$defs/wing_ref"
      - $ref: "#/$defs/floor_ref"
      - $ref: "#/$defs/room_ref"
      - $ref: "#/$defs/planting_ref"
      - $ref: "#/$defs/neighbor_property_ref"
      - $ref: "#/$defs/equipment_ref"
      - $ref: "#/$defs/furniture_ref"

  maintainable_element_ref:
    title: "Maintainable Element Reference"
    description: >
      Reference to any element that can be a maintenance target.
      Used in maintenance_task.target_ref.
    anyOf:
      - $ref: "#/$defs/parcel_ref"
      - $ref: "#/$defs/system_ref"
      - $ref: "#/$defs/component_ref"
      - $ref: "#/$defs/building_ref"
      - $ref: "#/$defs/room_ref"
      - $ref: "#/$defs/outdoor_zone_ref"
      - $ref: "#/$defs/boundary_segment_ref"
      - $ref: "#/$defs/specimen_ref"
      - $ref: "#/$defs/planting_ref"
      - $ref: "#/$defs/network_node_ref"
      - $ref: "#/$defs/iot_device_ref"
      - $ref: "#/$defs/equipment_ref"
      - $ref: "#/$defs/tool_ref"

  biomass_source_ref:
    title: "Biomass Source Reference"
    description: "Reference to an element that produces biomass (specimen or outdoor zone)."
    anyOf:
      - $ref: "#/$defs/specimen_ref"
      - $ref: "#/$defs/outdoor_zone_ref"

  biomass_destination_ref:
    title: "Biomass Destination Reference"
    description: "Reference to where processed biomass is used (zone for compost, system for fuel)."
    anyOf:
      - $ref: "#/$defs/outdoor_zone_ref"
      - $ref: "#/$defs/system_ref"

  room_or_zone_ref:
    title: "Room or Zone Reference"
    description: "Reference to a room or outdoor zone (for system distribution targets)."
    anyOf:
      - $ref: "#/$defs/room_ref"
      - $ref: "#/$defs/outdoor_zone_ref"

  # ═══════════════════════════════════════════════════════════════════════════
  # Generic Specifications (v1.3)
  # ═══════════════════════════════════════════════════════════════════════════

  specs:
    type: array
    title: "Technical Specifications"
    description: >
      Generic key-value-unit specification pairs for equipment, appliances,
      or other entities with diverse technical attributes. Used by T2
      (inventory report) to surface specifications without schema-per-type.
    items:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        key:
          type: string
          title: "Specification Key"
          description: "Specification name (e.g., cutting_width_cm, tank_capacity_liters, battery_voltage)."
          minLength: 1
        parameter:
          type: string
          title: "Specification Parameter"
          description: "Alternative specification name field (synonym of key; cewice data uses parameter)."
          minLength: 1
        value:
          type: string
          title: "Specification Value"
          description: "Specification value as string."
          minLength: 1
        unit:
          type: string
          title: "Unit"
          description: "Unit of measurement (omit for dimensionless values)."
          minLength: 1
