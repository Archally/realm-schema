---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "metamodel.schema.yaml"
title: "Realm Metamodel"
description: >
  Cross-cutting type definitions, typed reference patterns, spatial primitives,
  scheduling patterns, and external data contract shapes for the Realm schema
  suite. All schema files in this suite import from this file. This is the
  entry point for machine traversal.

x-gdsm:
  version: "2.3.0"
  methodology: "GDSM v1.0"
  suite_name: "Realm"
  suite_description: >
    A private real estate management model covering physical topology,
    infrastructure systems, vegetation and biomass cycles, maintenance
    operations, and surrounding context. Descriptive and planning state
    lives in YAML; operational telemetry and cost history are delegated
    to a companion external store (SQLite-format).
  design_rationale: >
    Designed using GDSM v1.0 greenfield mode. Five planes separate
    physical form (topology), built systems (infrastructure), living
    elements (nature), management workflows (operations), and external
    environment (context). Spatial primitives and scheduling patterns
    are cross-cutting concerns shared via metamodel $defs. External data
    contracts define the shape of records stored in the companion store.
    Informed by RESO Data Dictionary, IFC spatial hierarchy, Brick Schema
    relationships, CMMS maintenance patterns, iCalendar RRULE (RFC 5545),
    Trefle botanical API, and ISO 55000 asset lifecycle.
  planes:
    - id: topology
      description: "Physical form: parcels, buildings, wings, rooms, outdoor zones, boundaries, spatial layout, equipment, construction geometry"
      schemas:
        - "topology/estate.schema.yaml"
        - "topology/spatial.schema.yaml"
        - "topology/boundary.schema.yaml"
        - "topology/equipment.schema.yaml"
        - "topology/tools.schema.yaml"
        - "topology/construction.schema.yaml"
    - id: infrastructure
      description: "Built systems: energy, heating, water, electrical (boards, circuits, cable runs), network topology, IoT"
      schemas:
        - "infrastructure/systems.schema.yaml"
        - "infrastructure/network.schema.yaml"
    - id: nature
      description: "Living elements: specimen plants, categorical plantings, biomass circular flows, species care profiles, soil profiles"
      schemas:
        - "nature/vegetation.schema.yaml"
        - "nature/biomass.schema.yaml"
        - "nature/care.schema.yaml"
        - "nature/soil.schema.yaml"
        - "nature/recommendations.schema.yaml"
    - id: operations
      description: "Management: maintenance tasks, schedules, warranties, regulatory compliance, costs"
      schemas:
        - "operations/maintenance.schema.yaml"
        - "operations/compliance.schema.yaml"
    - id: context
      description: "Surroundings: neighbor properties, shared concerns, environmental factors, persons"
      schemas:
        - "context/surroundings.schema.yaml"
        - "context/persons.schema.yaml"
  drawable_entities:
    spatial_plan:
      - LP    # Land Parcel
      - BLD   # Building
      - WNG   # Wing (structural section of building, v2.0)
      - OZ    # Outdoor Zone
      - BS    # Boundary Segment
      - SPM   # Specimen
      - PTG   # Planting
      - NP    # Neighbor Property
      - EQP   # Equipment (gates on boundaries)
    floor_plan:
      - FLR   # Floor
      - RM    # Room
      - FRN   # Furniture
      - EQP   # Equipment
    construction:
      - WSG   # Wall Segment (v2.0)
      - SLB   # Floor Slab (v2.0)
      - RFP   # Roof Plane (v2.0)
      - CBR   # Cable Run (v2.3): drawn on a wall elevation, against the walls defined here
    infrastructure_diagram:
      - SYS   # System
      - CMP   # Component
      - NN    # Network Node
      - IOT   # IoT Device
    non_drawable:
      - MT    # Maintenance Task
      - NR    # Notification Rule
      - CC    # Cost Category
      - WRT   # Warranty
      - REG   # Regulatory Requirement
      - ECH   # Estate Change
      - RSK   # Risk
      - ISS   # Issue
      - SCP   # Species Care Profile
      - SOIL  # Soil Profile
      - NL    # Network Link
      - BMF   # Biomass Flow
      - REC   # Planting Recommendation
      - PRS   # Person
      - SC    # Shared Concern
      - EF    # Environmental Factor
      - TL    # Tool
      - UC    # Utility Connection
      - EVT   # Event (v2.0)
      - EPK   # Epic (v2.3)

  schema_graph:
    LP:
      schema: "topology/estate.schema.yaml"
      entity: "parcel"
      description: "Land parcel with cadastral identity and area"
    BLD:
      schema: "topology/estate.schema.yaml"
      entity: "building"
      description: "Building structure (house, garage, shed, greenhouse)"
    FLR:
      schema: "topology/estate.schema.yaml"
      entity: "floor"
      description: "Floor or storey within a building"
    RM:
      schema: "topology/estate.schema.yaml"
      entity: "room"
      description: "Room or indoor space with designated purpose"
    OZ:
      schema: "topology/estate.schema.yaml"
      entity: "outdoor_zone"
      description: "Outdoor area (garden, forest, driveway, orchard)"
    BS:
      schema: "topology/boundary.schema.yaml"
      entity: "boundary_segment"
      description: "Property boundary segment (fence, wall, hedge, natural)"
    SYS:
      schema: "infrastructure/systems.schema.yaml"
      entity: "system"
      description: "Infrastructure system (heating, solar, water, electrical)"
    CMP:
      schema: "infrastructure/systems.schema.yaml"
      entity: "component"
      description: "Physical component within an infrastructure system"
    UC:
      schema: "infrastructure/systems.schema.yaml"
      entity: "utility_connection"
      description: "External utility grid connection (electricity, gas, water, internet)"
    NN:
      schema: "infrastructure/network.schema.yaml"
      entity: "network_node"
      description: "Network device (router, switch, AP, mesh node)"
    IOT:
      schema: "infrastructure/network.schema.yaml"
      entity: "iot_device"
      description: "IoT or smart-home sensor, actuator, or controller"
    NL:
      schema: "infrastructure/network.schema.yaml"
      entity: "network_link"
      description: "Physical or wireless link between network nodes"
    CBR:
      schema: "infrastructure/systems.schema.yaml"
      entity: "cable_run"
      description: "Cable run or riser: the circuits it carries, the components it joins, and its route against wall segments (v2.3)"
    SPM:
      schema: "nature/vegetation.schema.yaml"
      entity: "specimen"
      description: "Individual plant or tree with identity and position"
    PTG:
      schema: "nature/vegetation.schema.yaml"
      entity: "planting"
      description: "Categorical planting group (hedge row, flower bed, lawn)"
    BMF:
      schema: "nature/biomass.schema.yaml"
      entity: "biomass_flow"
      description: "Biomass circular flow from source through process to use"
    SCP:
      schema: "nature/care.schema.yaml"
      entity: "species_care_profile"
      description: "Species-level care protocol with annual calendar, supplies, threats (v1.6)"
    SOIL:
      schema: "nature/soil.schema.yaml"
      entity: "soil_profile"
      description: "Soil characteristics and amendment recommendations for an area (v1.6)"
    MT:
      schema: "operations/maintenance.schema.yaml"
      entity: "maintenance_task"
      description: "Recurring maintenance task with schedule and target"
    NR:
      schema: "operations/maintenance.schema.yaml"
      entity: "notification_rule"
      description: "Alert trigger with lead time and delivery channel"
    CC:
      schema: "operations/maintenance.schema.yaml"
      entity: "cost_category"
      description: "Cost classification for budget tracking"
    WRT:
      schema: "operations/compliance.schema.yaml"
      entity: "warranty"
      description: "Manufacturer warranty with service conditions"
    REG:
      schema: "operations/compliance.schema.yaml"
      entity: "regulatory_requirement"
      description: "Legally mandated inspection or certification"
    NP:
      schema: "context/surroundings.schema.yaml"
      entity: "neighbor_property"
      description: "Adjacent property with descriptive attributes"
    SC:
      schema: "context/surroundings.schema.yaml"
      entity: "shared_concern"
      description: "Shared issue between this property and a neighbor"
    FRN:
      schema: "topology/equipment.schema.yaml"
      entity: "furniture"
      description: "Furniture piece placed in a room (v1.1)"
    EQP:
      schema: "topology/equipment.schema.yaml"
      entity: "equipment"
      description: "Appliance or equipment installed in a room (v1.1)"
    TL:
      schema: "topology/tools.schema.yaml"
      entity: "tool"
      description: "Portable tool stored on property (v1.4)"
    EF:
      schema: "context/surroundings.schema.yaml"
      entity: "environmental_factor"
      description: "Environmental condition affecting the property"
    PRS:
      schema: "context/persons.schema.yaml"
      entity: "person"
      description: "Person or organization involved with the property (v1.4)"
    RSK:
      schema: "risks.schema.yaml"
      entity: "risk"
      description: "Identified risk with mitigation plan (cross-cutting)"
    ISS:
      schema: "risks.schema.yaml"
      entity: "issue"
      description: "Identified current problem with measures (cross-cutting)"
    REC:
      schema: "nature/recommendations.schema.yaml"
      entity: "planting_recommendation"
      description: "Analytically-derived planting recommendation with screening/safety analysis (v1.7)"
    WNG:
      schema: "topology/estate.schema.yaml"
      entity: "wing"
      description: "Structural wing of a building with own footprint and roof geometry (v2.0)"
    WSG:
      schema: "topology/construction.schema.yaml"
      entity: "wall_segment"
      description: "Construction-layer wall segment with 3D coordinates and space adjacency (v2.0)"
    SLB:
      schema: "topology/construction.schema.yaml"
      entity: "floor_slab"
      description: "Construction-layer floor/ceiling slab with elevation (v2.0)"
    RFP:
      schema: "topology/construction.schema.yaml"
      entity: "roof_plane"
      description: "Construction-layer roof plane with pitch and orientation (v2.0)"
    ECH:
      schema: "estate-change.schema.yaml"
      entity: "estate_change"
      description: "AS-IS to TO-BE change or undertaking concerning the estate, with dependency ordering (cross-cutting)"
    EVT:
      schema: "events.schema.yaml"
      entity: "event"
      description: "Fact or observation log entry with timestamp and affected entities (v2.0)"
    EPK:
      schema: "estate-change.schema.yaml"
      entity: "epic"
      description: "Named group of estate changes with a display order (v2.3)"
  tasks:
    - id: T1
      name: "Maintenance Calendar Generation"
      type: generative
      mfs_target: 90
    - id: T2
      name: "Property Inventory Report"
      type: generative
      mfs_target: 85
    - id: T3
      name: "Garden Planning Advisory"
      type: analytical
      mfs_target: 80
    - id: T4
      name: "Boundary & Privacy Assessment"
      type: analytical
      mfs_target: 85
    - id: T5
      name: "2D Spatial Layout Visualization"
      type: visualization
      mfs_target: 80
    - id: T6
      name: "Infrastructure Topology Map"
      type: visualization
      mfs_target: 75
    - id: T7
      name: "Biomass Circular Flow Diagram"
      type: visualization
      mfs_target: 75
    - id: T8
      name: "Estate Change Planning Report"
      type: governance
      mfs_target: 80
    - id: T9
      name: "Cost Overview Dashboard"
      type: visualization
      mfs_target: 70
    - id: T10
      name: "Seasonal Garden Care Calendar"
      type: generative
      mfs_target: 85
    - id: T11
      name: "Shopping List Generator"
      type: generative
      mfs_target: 75

  modeling_guidance:
    - lesson: >
        A realm's `coordinate_system` carries its georeference as fields:
        `origin_wgs84`, `origin_projected` (an EPSG code with northing and
        easting), `origin_elevation_m` and `elevation_datum`, with the axes'
        bearings following from `north_angle_degrees` (+X lies 90 degrees to
        the left of +Y). Read them there, never out of `origin_description`,
        which is for the prose around them. With the origin and the angle a
        real-world GPS fix or a grid point converts into model coordinates by
        plain arithmetic, which is what `rl locate` does; without them,
        position can only be reasoned from parcel geometry.
      category: semantics
      date: 2026-09-04
      evidence: >
        Modeling session 2026-08-30 converted 68 geotagged photographs through
        a transform written by hand from prose; release 2.3.0 moved the same
        four facts into fields, and rl locate reproduces the origin to 0.000 m
        and the parcel's surveyed NE corner to 26.42 m from them.
      schema_version: "2.3.0"

    - lesson: >
        A `position` says how it is known: `position_source` (surveyed, tape,
        gps, estimated), `position_accuracy_m`, and `position_derived_from`
        when it was placed relative to another element. Write a consumer-GPS
        fix as `gps` with its accuracy rather than leaving the field unset:
        the uncertainty is now a value a consumer can draw and a rule can
        read, and an entity with no position at all tells a reader nothing.
        Two tape measurements from the endpoints of a known boundary segment
        still resolve a position an order of magnitude better than a phone
        does, and the source field is what lets the two be told apart later.
      category: gotcha
      date: 2026-09-04
      evidence: >
        Modeling session 2026-08-30: consumer GPS placed a photographer 10.6 m
        outside a parcel he was standing inside, with a median excursion of
        6.2 m across the set, and the schema of the day could record none of
        that. Release 2.3.0 added the three provenance fields; a gps source in
        a model with no WGS84 origin is a semantic-layer warning.
      schema_version: "2.3.0"

    - lesson: >
        Check a coordinate transform against the model before trusting it:
        project a set of known-good points and count how many fall inside the
        parcel outlines. A wrong origin, a wrong axis convention or a swapped
        northing and easting all produce plausible-looking numbers, and only
        containment distinguishes them from correct ones.
      category: workflow
      date: 2026-08-30
      evidence: >
        Modeling session 2026-08-30. 58 of 70 projected points fell inside the
        declared parcel polygons, and every excursion had an explanation (a
        public verge, a neighbour's land), which is what made the remaining
        spread readable as instrument error rather than as a broken transform.
      schema_version: "2.2.0"

    - lesson: >
        Something standing outdoors goes where it stands, and the type says
        what it is. `furniture` accepts `room_ref`, `building_ref` and, from
        2.3.0, `outdoor_zone_ref`: garden seating hangs off a gazebo or a
        shed, a terrace modelled as a room carries the table, the chairs and
        the parasol that stand on it, and a table in a forest clearing stands
        in the clearing's outdoor zone. Pick the placement by where the piece
        is and the type by what it is; never the other way round. `equipment`
        takes `outdoor_zone_ref` too, but its vocabulary is appliances and
        machinery, so filing a bench there buys a graph edge at the price of
        a wrong classification, and the enum-borrowed tag is what marks the
        borrowing until the vocabulary catches up.
      category: structure
      date: 2026-09-04
      evidence: >
        Modeling sessions 2026-08-30 and 2026-09-04. Ten outdoor pieces were
        placed through a building or a terrace room; three in a clearing had
        no home and went in as equipment with type "other", which is what
        made the clearing's zone the missing reference rather than a missing
        container. The earlier version of this lesson recommended prose for
        that case.
      schema_version: "2.3.0"

    - lesson: >
        A component or a planting may stand for many identical physical units
        - a dozen garden lamps, six grafted shrubs - and the group carries the
        count, the care and the attributes while `members` carries where each
        unit stands: one explicit point per unit, three-dimensional, with a
        label and, when the point was read from prose or computed from a
        spacing rule rather than measured, a `derivation` saying so. Write
        points, never a rule: "eight along BS003 at 0.5 m" is a computation,
        and the schema records values and references. Where the prose does
        not say - "by the trees" names no tree - leave those units out instead
        of inventing positions for them; a partial list that is honest about
        its remainder is worth more than a complete one that is not. A unit
        that needs a history of its own (a lamp that failed, a shrub that died)
        becomes an entity with `member_of_ref` and leaves the list.
      category: gotcha
      date: 2026-09-04
      evidence: >
        Modeling sessions 2026-09-01 and 2026-09-04. Two lighting components
        declared 32 lamps between them and a consumer drawing the estate placed
        none of them, because the only statement of where they stand was
        prose; 26 were recoverable and 6 were not. The recovered points lived
        in an extension key until 2.3.0 declared the field, and a planting
        carried six labelled points the same way.
      schema_version: "2.3.0"

type: object

$defs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Versioning
  # ═══════════════════════════════════════════════════════════════════════════

  semver:
    type: string
    title: "Semantic Version"
    description: "Semantic version string (MAJOR.MINOR.PATCH)."
    pattern: "^\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9.]+)?(\\+[a-zA-Z0-9.]+)?$"
    examples: ["1.0.0", "0.3.1-beta"]

  schema_version:
    type: string
    title: "Schema Version"
    description: >
      Realm schema version this document targets. The v2.3 schemas accept
      documents declaring 2.2.0, 2.1.0 and 2.0.0; 2.3.0 is additive over 2.2.0,
      and 2.2.0 renamed the migration entity to estate_change, so a document
      older than that which uses the construct needs the rename before it will
      validate.
    enum: ["2.3.0", "2.2.0", "2.1.0", "2.0.0"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Common
  # ═══════════════════════════════════════════════════════════════════════════

  tags:
    type: array
    title: "Tags"
    description: "Arbitrary classification tags for filtering and grouping. One tag has a fixed meaning: `enum-borrowed` marks an entity whose enum-valued field carries the nearest existing value because the right one does not exist yet, so the borrowing is findable by query when the vocabulary is extended."
    items:
      type: string
      minLength: 1
    uniqueItems: true
    examples: [["heating", "warranty", "urgent"], ["enum-borrowed"]]

  iso_date:
    type: string
    format: date
    title: "ISO 8601 Date"
    description: "Date in YYYY-MM-DD format."
    examples: ["2026-03-08"]

  flexible_date:
    type: string
    title: "Date of Known Precision"
    description: >
      A full calendar date, or a year and month when the day is not known.
      Recorded events often come from memory or from a receipt that names
      only the month; this type keeps that distinction visible instead of
      inviting an invented day. Lexicographic order is chronological order,
      so values sort correctly whichever precision they carry.
    pattern: "^\\d{4}-(0[1-9]|1[0-2])(-(0[1-9]|[12]\\d|3[01]))?$"
    examples: ["2025-04-18", "2024-09"]

  electrical_component_type:
    type: string
    title: "Electrical Component Type"
    description: >
      The role a component plays in an electrical distribution system.
      `distribution-panel`: a board holding protective devices, the main one
      or a sub-board. `protective-device`: a breaker, residual-current device,
      combined RCBO, fuse or main switch mounted in a board. `circuit`: a
      named group of conductors under one protective device, the unit a
      board's schedule lists. `junction-box`: an enclosure where conductors
      are joined. `socket-outlet`, `switch`, `lighting-fixture`: the terminal
      devices a circuit ends in. `cable-end`: a cable emerging from a wall,
      floor or ceiling whose circuit and purpose are not yet known; it becomes
      a terminal device or the end of a cable run once identified. A
      component uses these values in component_type when it takes part in
      circuit_ref, protected_by_ref or fed_from_ref.
    enum:
      - "distribution-panel"
      - "protective-device"
      - "circuit"
      - "junction-box"
      - "socket-outlet"
      - "switch"
      - "lighting-fixture"
      - "cable-end"
    examples: ["circuit", "socket-outlet"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Spatial Primitives
  # ═══════════════════════════════════════════════════════════════════════════

  position:
    type: object
    title: "2D Position"
    description: >
      Property-relative position in the coordinate system's unit (default meters).
      Origin and north direction defined by the realm's coordinate_system.
      Accuracy and source are recorded beside the position on the entity, in
      position_accuracy_m and position_source.
      Answers CQ21. Used by T5 for 2D spatial layout rendering.
    required: [x, y]
    additionalProperties: false
    properties:
      x:
        type: number
        title: "X Coordinate"
        description: "Horizontal position from origin (east-positive when north is +Y)."
        examples: [12.5]
      y:
        type: number
        title: "Y Coordinate"
        description: "Vertical position from origin (north-positive by default)."
        examples: [30.0]

  polygon_footprint:
    type: object
    title: "Polygon Footprint"
    description: >
      Closed polygon defined by vertices relative to the element's position
      (centroid). Vertices are in local coordinates before rotation. The
      renderer rotates by the element's rotation_degrees then translates
      by position. Used by T5.
    required: [shape, vertices]
    additionalProperties: false
    properties:
      shape:
        type: string
        const: "polygon"
      vertices:
        type: array
        title: "Polygon Vertices"
        description: "Ordered vertices relative to centroid. First and last are implicitly connected."
        minItems: 3
        items:
          $ref: "#/$defs/position"
        examples:
          - [{x: -5, y: -4}, {x: 5, y: -4}, {x: 5, y: 4}, {x: -5, y: 4}]

  circle_footprint:
    type: object
    title: "Circle Footprint"
    description: >
      Circular shape centered on the element's position. Used for tree
      canopies (CQ09) and round features. Used by T5.
    required: [shape, radius]
    additionalProperties: false
    properties:
      shape:
        type: string
        const: "circle"
      radius:
        type: number
        title: "Radius"
        description: "Radius in coordinate system units (default meters) from center."
        exclusiveMinimum: 0
        examples: [3.5]

  footprint:
    title: "Footprint"
    description: "Ground-projection shape of an element - polygon or circle."
    anyOf:
      - $ref: "#/$defs/polygon_footprint"
      - $ref: "#/$defs/circle_footprint"

  # ── 3D Spatial Primitives (v2.0) ──────────────────────────────────────────
  # Convention: polygon vertices are counter-clockwise (CCW) when viewed from
  # above, with +Y pointing north in model space. This aligns with GeoJSON,
  # Three.js, and most geometry libraries. Renderers compute outward normals
  # from vertex winding order.

  position3d:
    type: object
    title: "3D Position"
    description: "Property-relative position with elevation above vertical datum."
    required: [x, y, z]
    additionalProperties: false
    properties:
      x:
        type: number
        title: "X Coordinate"
        description: "Horizontal position from origin (east-positive when north is +Y)."
      y:
        type: number
        title: "Y Coordinate"
        description: "Vertical position from origin (north-positive by default)."
      z:
        type: number
        title: "Z Coordinate"
        description: "Height above vertical datum (meters)."

  position_accuracy_m:
    type: number
    title: "Position Accuracy (m)"
    description: >
      Radius within which the true point lies, in metres, for the entity's
      position and for any outline placed relative to it. Every answer that
      uses the position carries this number with it.
    minimum: 0
    examples: [0.1, 5]

  position_source:
    type: string
    title: "Position Source"
    description: >
      How the position was obtained. `surveyed` from a cadastral or
      instrument survey; `tape` from tape measurements off known points;
      `gps` from a satellite fix, which needs the realm's WGS84 origin to
      be declared before it can be placed; `estimated` by eye or from a
      description.
    enum: ["surveyed", "tape", "gps", "estimated"]
    examples: ["tape"]

  position_derived_from:
    $ref: "#/$defs/positioned_element_ref"
    title: "Position Derived From"
    description: >
      The element this position was placed relative to. Records that the
      dependency exists, not the offset: correct the named element and this
      one is due for correction too. The offset stays in the description.
    examples: ["CMP042"]

  derivation:
    type: object
    title: "Derivation"
    description: >
      Where a value came from when it was not measured on site: the
      statement it was read from and the date it was written down. A
      later survey then corrects a derivation instead of guessing whether
      the numbers were ever measured.
    required: [derived_from, derived_on]
    additionalProperties: false
    properties:
      derived_from:
        type: string
        title: "Derived From"
        description: "The source the value was read from: a field name, an owner's statement, a photograph path."
        minLength: 1
        examples: ["description", "owner-statement", "pictures/2026-05-23-lawn.jpg"]
      derived_on:
        $ref: "#/$defs/iso_date"
        title: "Derived On"
        description: "The day the value was derived."
        examples: ["2026-09-01"]

  placed_member:
    type: object
    title: "Placed Member"
    description: >
      One unit of a group entity that stands for several identical things,
      such as one lamp of a lighting component or one shrub of a planting.
      The group carries the count, the care and the attributes; the member
      carries only where it stands, in absolute model coordinates with a
      height above the vertical datum, an optional label, and where the
      point came from when it was derived rather than measured. A unit that
      needs a history of its own becomes an entity and leaves this list.
    required: [position]
    additionalProperties: false
    properties:
      position:
        $ref: "#/$defs/position3d"
        title: "Position"
        description: "Where this unit stands, absolute, with z for a lamp head or a ground-level plant."
        examples: [{x: 12.3, y: 1.5, z: 0}]
      label:
        type: string
        title: "Label"
        description: "Short name that tells the units apart, such as W1 or lamp-BS003-4."
        minLength: 1
        examples: ["W1", "E3"]
      derivation:
        $ref: "#/$defs/derivation"
        title: "Derivation"
        description: "Present when the point was read from prose or computed from a count along a segment rather than measured."

  vertex3d:
    type: object
    title: "3D Vertex"
    description: >
      3D vertex for use in polygon and polyline contexts. Identical shape to
      position3d - use position3d for point locations, vertex3d for polygon
      and polyline vertices.
    required: [x, y, z]
    additionalProperties: false
    properties:
      x: { type: number }
      y: { type: number }
      z: { type: number }

  polyline3d:
    type: object
    title: "3D Polyline"
    description: "Ordered sequence of 3D vertices forming an open path."
    required: [vertices]
    additionalProperties: false
    properties:
      vertices:
        type: array
        minItems: 2
        items:
          $ref: "#/$defs/vertex3d"

  polygon3d:
    type: object
    title: "3D Polygon"
    description: >
      Closed 3D polygon defined by ordered vertices. First and last vertices
      are implicitly connected. Vertices must be CCW when viewed from the
      outward-facing side (normal follows right-hand rule).
    required: [vertices]
    additionalProperties: false
    properties:
      vertices:
        type: array
        minItems: 3
        items:
          $ref: "#/$defs/vertex3d"

  coordinate_system:
    type: object
    title: "Coordinate System"
    description: >
      Property-relative 2D coordinate system. Defines where (0,0) is,
      which direction is north, and the measurement unit. All positions
      in the model are relative to this system. A model that declares
      origin_wgs84 can place a satellite fix; one that declares only
      origin_description cannot. Answers CQ21. Used by T5.
    required: [unit]
    additionalProperties: false
    properties:
      origin_description:
        type: string
        title: "Origin Description"
        description: "Human-readable description of the (0,0) point on the property."
        examples: ["South-west corner of main parcel LP001"]
      north_angle_degrees:
        type: number
        title: "North Angle"
        description: >
          Angle in degrees from the +Y axis to true north, measured clockwise.
          Default 0 means +Y points north. The +X axis lies 90 degrees to the
          left of +Y when looking along it, so +X points north when this is
          270, and the bearing of +Y is 360 minus this value. A satellite fix
          or a national-grid point is converted into model coordinates with
          this angle and origin_wgs84 or origin_projected.
        default: 0
        minimum: 0
        exclusiveMaximum: 360
        examples: [0, 15.5]
      origin_wgs84:
        type: object
        title: "Origin (WGS84)"
        description: >
          Geographic coordinates of the model origin (0, 0). With
          north_angle_degrees this is enough to convert a satellite fix
          into model coordinates and back.
        required: [latitude, longitude]
        additionalProperties: false
        properties:
          latitude:
            type: number
            title: "Latitude"
            minimum: -90
            maximum: 90
            examples: [54.44591507]
          longitude:
            type: number
            title: "Longitude"
            minimum: -180
            maximum: 180
            examples: [17.73045547]
      origin_projected:
        type: object
        title: "Origin (Projected Grid)"
        description: >
          The model origin in a national or regional projected grid, named
          by its EPSG code. Fields are named northing and easting so the
          grid's own axis order never has to be remembered. The bearing of
          the model axes in this grid follows from north_angle_degrees and
          is not stored twice.
        required: [epsg_code, northing, easting]
        additionalProperties: false
        properties:
          epsg_code:
            type: integer
            title: "EPSG Code"
            description: "Registry code of the projected coordinate reference system."
            minimum: 1024
            examples: [2180]
          crs_name:
            type: string
            title: "CRS Name"
            description: "Display name of the system the code identifies; the code is authoritative."
            examples: ["PUWG-1992"]
          northing:
            type: number
            title: "Northing"
            examples: [732067.42]
          easting:
            type: number
            title: "Easting"
            examples: [417700.71]
      origin_elevation_m:
        type: number
        title: "Origin Elevation (m)"
        description: "Height of the model origin in the named elevation datum. Ties local Z=0 to a national height system."
        examples: [153.8]
      elevation_datum:
        type: string
        title: "Elevation Datum"
        description: "Name of the height system origin_elevation_m is expressed in."
        examples: ["PL-EVRF2007-NH"]
      unit:
        type: string
        title: "Measurement Unit"
        description: "Unit for all position and dimension values in the model."
        enum: ["meters", "feet"]
        default: "meters"
      description:
        type: string
        title: "Description"
        description: >
          Additional notes about the coordinate system: design rationale,
          relationship to true geographic north, alignment choices.

      # ── Vertical Datum (v2.0) ──
      vertical_datum_type:
        type: string
        title: "Vertical Datum"
        description: >
          Reference plane for all Z values in the model. local-ground means
          Z=0 is the ground level at the coordinate origin point. parcel-benchmark
          uses a surveyed benchmark on a specific parcel. sea-level-relative uses
          meters above mean sea level.
        enum: ["local-ground", "parcel-benchmark", "sea-level-relative"]
        default: "local-ground"
      vertical_datum_description:
        type: string
        title: "Vertical Datum Description"
        description: "Human-readable clarification of the Z reference plane."
        examples: ["Ground level at NW corner of LP001 (coordinate origin)"]

  compass_direction:
    type: string
    title: "Compass Direction"
    description: "Cardinal or intercardinal compass direction."
    enum: ["N", "NE", "E", "SE", "S", "SW", "W", "NW"]

  spatial_relation:
    type: object
    title: "Spatial Relation"
    description: >
      Directional or proximity relationship between two positioned elements.
      Answers CQ21 (relative positioning) and CQ22 (shade/exposure).
      Used by T4 (privacy assessment) and T5 (layout rendering).
    required: [from_ref, to_ref, relation_type]
    additionalProperties: false
    properties:
      from_ref:
        $ref: "#/$defs/positioned_element_ref"
        title: "From Element"
        description: "Source element of the spatial relation."
      to_ref:
        $ref: "#/$defs/positioned_element_ref"
        title: "To Element"
        description: "Target element of the spatial relation."
      relation_type:
        type: string
        title: "Relation Type"
        description: >
          Kind of spatial relationship between elements. shares-boundary
          states that two elements touch; which edge touches which is
          declared on the element itself, in shared_edges.
        enum:
          - "overlooks"
          - "shades"
          - "blocks-wind"
          - "drains-to"
          - "faces"
          - "enables-access"
          - "shares-boundary"
          - "blocks-view"
        examples: ["shades"]
      distance_m:
        type: number
        title: "Distance (meters)"
        description: "Approximate distance between elements in meters."
        minimum: 0
        examples: [4.5]
      notes:
        type: string
        title: "Notes"
        description: "Free-text clarification of the spatial relationship."
        examples: ["Neighbor's oak shades vegetable garden after 3pm in summer"]

  edge_bearing_ref:
    title: "Edge-Bearing Element Reference"
    description: >
      Reference to an element whose outline has edges: a polygon footprint
      (parcel, building, outdoor zone, planting), a neighbour's parcel
      outline, or a polyline (boundary segment). Used as the far side of a
      shared edge. For a neighbour the outline read is parcel_footprint,
      the edge of their land, never footprint, which is their building.
    anyOf:
      - $ref: "#/$defs/parcel_ref"
      - $ref: "#/$defs/building_ref"
      - $ref: "#/$defs/outdoor_zone_ref"
      - $ref: "#/$defs/boundary_segment_ref"
      - $ref: "#/$defs/planting_ref"
      - $ref: "#/$defs/neighbor_property_ref"

  shared_edge:
    type: object
    title: "Shared Edge"
    description: >
      Declares that one edge of this element's outline lies on an edge of
      another element's outline, so that moving the other element's edge
      moves this one with it. Edges are numbered from 0 in vertex order:
      edge n runs from vertex n to vertex n+1, and a polygon's last edge
      closes back to vertex 0; a boundary segment's polyline has no closing
      edge. Both outlines are read in absolute model coordinates (a
      footprint's vertices offset by its position). The two edges must lie
      on one line; their endpoints need not coincide, since a lawn's
      western edge may run along only part of a hedge's eastern one. The
      element that declares the edge is the one that follows; the element
      it names does not declare the edge back.
    required: [edge, with_ref]
    additionalProperties: false
    properties:
      edge:
        type: integer
        title: "Own Edge Index"
        description: "Index of this element's edge, counted from 0 in vertex order."
        minimum: 0
        examples: [3]
      with_ref:
        $ref: "#/$defs/edge_bearing_ref"
        title: "Shared With"
        description: "The element whose edge this edge lies on."
        examples: ["PTG001", "OZ021", "BS003"]
      with_edge:
        type: integer
        title: "Far Edge Index"
        description: >
          Index of the far element's edge, counted the same way. Omit only
          when the far element is a boundary segment with exactly two
          vertices, which has one edge.
        minimum: 0
        examples: [1]
      note:
        type: string
        title: "Note"
        description: "Why these edges are one line, in one sentence."
        examples: ["The lawn ends where the hedge begins; the hedge was measured, the lawn was not"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Scheduling (iCalendar RRULE — RFC 5545)
  # ═══════════════════════════════════════════════════════════════════════════

  rrule_schedule:
    type: object
    title: "Recurrence Schedule"
    description: >
      Recurring schedule using iCalendar RRULE (RFC 5545). Stores the
      pattern; instances are calculated at runtime. Answers CQ13 (due dates),
      CQ14 (warranty service intervals), CQ10 (watering). Used by T1, T3, T8.
    required: [rrule, summary]
    additionalProperties: false
    properties:
      rrule:
        type: string
        title: "RRULE String"
        description: "iCalendar recurrence rule per RFC 5545."
        pattern: "^RRULE:"
        examples:
          - "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=3MO"
          - "RRULE:FREQ=WEEKLY;INTERVAL=2;BYDAY=SA"
          - "RRULE:FREQ=DAILY;INTERVAL=3;BYMONTH=4,5,6,7,8,9"
      summary:
        type: string
        title: "Human Summary"
        description: "Plain-language description of the recurrence."
        examples:
          - "Every year in March, third Monday"
          - "Every 2 weeks on Saturday"
          - "Every 3 days from April through September"
      active_months:
        type: array
        title: "Active Months"
        description: "Months (1-12) during which the schedule is active. Omit for year-round."
        items:
          type: integer
          minimum: 1
          maximum: 12
        uniqueItems: true
        examples: [[4, 5, 6, 7, 8, 9]]
      start_date:
        $ref: "#/$defs/iso_date"
        title: "Effective Start"
        description: "Date from which this schedule takes effect."

  # ═══════════════════════════════════════════════════════════════════════════
  # External Data Contracts
  # ═══════════════════════════════════════════════════════════════════════════

  execution:
    type: object
    title: "Execution"
    description: >
      One occasion on which planned work was actually carried out. Its
      identity is the work plus the date, so it is recorded in place on the
      task or change it belongs to rather than as an entity of its own. When
      an execution acquires meaning beyond the work itself - it caused
      damage, it involved other people, it is worth finding later on its own
      terms - `event_ref` promotes it to an Event, which is where
      participants and outcomes are recorded. Answers CQ34.
    required: [date]
    additionalProperties: false
    properties:
      date:
        $ref: "#/$defs/flexible_date"
        title: "Date Carried Out"
        description: "When the work was done, to the day or to the month."
      event_ref:
        $ref: "#/$defs/event_ref"
        title: "Event"
        description: >
          The Event this execution produced, when it was significant enough
          to be recorded as one.
      cost_pln:
        type: number
        title: "Cost (PLN)"
        description: >
          What this occasion cost. A cost belongs either to the execution
          that incurred it or to a linked Event, never to both.
        minimum: 0
        examples: [450, 1200]
      note:
        type: string
        title: "Note"
        description: "What was done on this occasion, in one or two sentences."
        examples: ["Hedge cut back and the clippings taken to the compost heap"]

  cost_record_shape:
    type: object
    title: "Cost Record Shape"
    description: >
      Contract for cost records stored in the external data store (SQLite).
      Not stored in the YAML model - defines the record shape for the
      companion store. Answers CQ16. Used by T9.
    required: [date, amount, currency, cost_category_ref]
    additionalProperties: false
    properties:
      date:
        $ref: "#/$defs/iso_date"
        description: "Date the cost was incurred."
      amount:
        type: number
        description: "Cost amount in the specified currency."
        examples: [125.50]
      currency:
        type: string
        description: "ISO 4217 currency code."
        pattern: "^[A-Z]{3}$"
        examples: ["EUR", "USD", "PLN"]
      cost_category_ref:
        $ref: "#/$defs/cost_category_ref"
        description: "Reference to the cost category this record belongs to."
      description:
        type: string
        description: "What the cost was for."
        examples: ["Annual boiler service by TechHeat GmbH"]
      source:
        type: string
        description: "Origin document (invoice number, receipt ID)."
        examples: ["INV-2026-0042"]

  measurement_record_shape:
    type: object
    title: "Measurement Record Shape"
    description: >
      Contract for telemetry/measurement records in the external data store.
      Covers energy readings, temperature, humidity, flow meters, etc.
      Used by T6 (infrastructure map), T9 (cost dashboard).
    required: [timestamp, value, unit, system_ref]
    additionalProperties: false
    properties:
      timestamp:
        type: string
        format: date-time
        description: "ISO 8601 date-time of the measurement."
        examples: ["2026-03-08T14:30:00Z"]
      value:
        type: number
        description: "Measured value."
        examples: [12450.5]
      unit:
        type: string
        description: "Unit of measurement."
        examples: ["kWh", "°C", "%RH", "m³", "hPa"]
      system_ref:
        $ref: "#/$defs/system_ref"
        description: "System this measurement belongs to."
      point_name:
        type: string
        description: "Named measurement point on the system."
        examples: ["supply_temperature", "total_consumption", "battery_soc"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Notification
  # ═══════════════════════════════════════════════════════════════════════════

  notification_channel:
    type: string
    title: "Notification Channel"
    description: "Delivery channel for maintenance and compliance notifications. Answers CQ17."
    enum: ["email", "sms", "push", "calendar", "webhook"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Location & Climate
  # ═══════════════════════════════════════════════════════════════════════════

  location:
    type: object
    title: "Property Location"
    description: >
      Geographic location and postal address. Latitude/longitude are for
      climate lookups and sun-path estimation, not for spatial layout
      (which uses the property-relative coordinate system). Answers CQ01. Used by T2.
    additionalProperties: false
    properties:
      address:
        type: string
        title: "Street Address"
        examples: ["123 Oak Lane"]
      city:
        type: string
        title: "City"
        examples: ["Springfield"]
      region:
        type: string
        title: "State / Province / Region"
        examples: ["Bavaria", "Oregon"]
      country:
        type: string
        title: "Country"
        examples: ["Germany", "United States"]
      postal_code:
        type: string
        title: "Postal Code"
        examples: ["80331"]
      latitude:
        type: number
        title: "Latitude"
        description: "WGS84 latitude for climate and sun-path lookups."
        minimum: -90
        maximum: 90
        examples: [48.1351]
      longitude:
        type: number
        title: "Longitude"
        description: "WGS84 longitude for climate and sun-path lookups."
        minimum: -180
        maximum: 180
        examples: [11.5820]

  climate_profile:
    type: object
    title: "Climate Profile"
    description: >
      Climate metadata for the property. Drives garden planning (CQ11),
      plant selection (CQ09, CQ10), and seasonal maintenance scheduling
      (CQ13). Used by T3 (garden advisory).
    additionalProperties: false
    properties:
      hardiness_zone:
        type: string
        title: "USDA Hardiness Zone"
        description: "Plant hardiness zone. Determines cold-tolerance requirements for plants."
        pattern: "^\\d{1,2}[ab]$"
        examples: ["7a", "6b"]
      koppen_classification:
        type: string
        title: "Köppen Climate Classification"
        description: "Climate type code (e.g., Cfb = oceanic, Dfb = humid continental)."
        examples: ["Cfb", "Dfb", "Csa"]
      avg_annual_rainfall_mm:
        type: number
        title: "Average Annual Rainfall (mm)"
        minimum: 0
        examples: [850]
      frost_free_days:
        type: integer
        title: "Frost-Free Days per Year"
        minimum: 0
        examples: [180]
      first_frost_date:
        type: string
        title: "Typical First Frost (MM-DD)"
        pattern: "^\\d{2}-\\d{2}$"
        examples: ["10-15"]
      last_frost_date:
        type: string
        title: "Typical Last Frost (MM-DD)"
        pattern: "^\\d{2}-\\d{2}$"
        examples: ["04-20"]
      prevailing_wind_direction:
        $ref: "#/$defs/compass_direction"
        title: "Prevailing Wind"
        description: "Dominant wind direction at this location."

  # ═══════════════════════════════════════════════════════════════════════════
  # Lifecycle (v2.3)
  # ═══════════════════════════════════════════════════════════════════════════

  lifecycle_state:
    type: string
    title: "Lifecycle State"
    description: >
      Whether the record is current. `active` is the default and is what
      an entity without a lifecycle block means. `retired`: the thing no
      longer exists or is no longer in use; the record stays so that
      references to it keep resolving. `superseded`: another record has
      taken its place, named in superseded_by.
    enum: ["active", "retired", "superseded"]
    default: "active"
    examples: ["retired"]

  lifecycle:
    type: object
    title: "Lifecycle"
    description: >
      Records that a thing ended without deleting the record of it. A
      retired or superseded entity is excluded from lists, graphs and
      generated documents by default, and every consumer that excludes
      them reports how many it excluded, including zero, so that an
      absence is never mistaken for a thing that was never there.
      Independent of any status field: status says where the work stands,
      lifecycle says whether the record is current.
    required: [state]
    additionalProperties: false
    properties:
      state:
        $ref: "#/$defs/lifecycle_state"
        title: "State"
      retired_at:
        $ref: "#/$defs/flexible_date"
        title: "Retired At"
        description: "When the thing ended, to the day or to the month."
        examples: ["2026-05-25", "2026-03"]
      retired_reason:
        type: string
        title: "Retired Reason"
        description: "Why, in one sentence: removed, died, given away, replaced, merged."
        minLength: 1
        examples: ["Raised bed dismantled; the ground was levelled and sown with grass"]
      superseded_by:
        $ref: "#/$defs/any_entity_ref"
        title: "Superseded By"
        description: >
          The record that took this one's place. May be of another type:
          a planting split into individual specimens names one of them
          here and the rest in retired_reason.
        examples: ["ECH031c", "SPM030"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Entity Reference Types — Topology
  # ═══════════════════════════════════════════════════════════════════════════

  parcel_ref:
    type: string
    title: "Parcel Reference"
    description: "Typed reference to a Land Parcel entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?LP\\d{3,}$"
    examples: ["LP001", "main.LP001"]

  building_ref:
    type: string
    title: "Building Reference"
    description: "Typed reference to a Building entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?BLD\\d{3,}$"
    examples: ["BLD001", "east-wing.BLD002"]

  floor_ref:
    type: string
    title: "Floor Reference"
    description: "Typed reference to a Floor entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?FLR\\d{3,}$"
    examples: ["FLR001", "main-house.FLR002"]

  room_ref:
    type: string
    title: "Room Reference"
    description: "Typed reference to a Room entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?RM\\d{3,}$"
    examples: ["RM001", "main-house.RM012"]

  outdoor_zone_ref:
    type: string
    title: "Outdoor Zone Reference"
    description: "Typed reference to an Outdoor Zone entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?OZ\\d{3,}$"
    examples: ["OZ001", "garden.OZ003"]

  boundary_segment_ref:
    type: string
    title: "Boundary Segment Reference"
    description: "Typed reference to a Boundary Segment entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?BS\\d{3,}$"
    examples: ["BS001"]

  furniture_ref:
    type: string
    title: "Furniture Reference"
    description: "Typed reference to a Furniture entity (v1.1)."
    pattern: "^([a-z][a-z0-9-]*\\.)?FRN\\d{3,}$"
    examples: ["FRN001"]

  equipment_ref:
    type: string
    title: "Equipment Reference"
    description: "Typed reference to an Equipment entity (v1.1)."
    pattern: "^([a-z][a-z0-9-]*\\.)?EQP\\d{3,}$"
    examples: ["EQP001"]

  tool_ref:
    type: string
    title: "Tool Reference"
    description: "Typed reference to a portable Tool entity (v1.4)."
    pattern: "^([a-z][a-z0-9-]*\\.)?TL\\d{3,}$"
    examples: ["TL001"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Entity Reference Types — Construction (v2.0)
  # ═══════════════════════════════════════════════════════════════════════════

  wing_ref:
    type: string
    title: "Wing Reference"
    description: "Typed reference to a structural wing of a building (v2.0)."
    pattern: "^([a-z][a-z0-9-]*\\.)?WNG\\d{3,}$"
    examples: ["WNG001", "main.WNG001"]

  wall_segment_ref:
    type: string
    title: "Wall Segment Reference"
    description: "Typed reference to a wall segment in the construction layer (v2.0)."
    pattern: "^([a-z][a-z0-9-]*\\.)?WSG\\d{3,}$"
    examples: ["WSG001"]

  slab_ref:
    type: string
    title: "Floor Slab Reference"
    description: "Typed reference to a floor/ceiling slab in the construction layer (v2.0)."
    pattern: "^([a-z][a-z0-9-]*\\.)?SLB\\d{3,}$"
    examples: ["SLB001"]

  roof_plane_ref:
    type: string
    title: "Roof Plane Reference"
    description: "Typed reference to a roof plane in the construction layer (v2.0)."
    pattern: "^([a-z][a-z0-9-]*\\.)?RFP\\d{3,}$"
    examples: ["RFP001"]

  event_ref:
    type: string
    title: "Event Reference"
    description: "Typed reference to an Event entity in the event log (v2.0)."
    pattern: "^([a-z][a-z0-9-]*\\.)?EVT\\d{3,}$"
    examples: ["EVT001", "EVT042"]

  estate_change_ref:
    type: string
    title: "Estate Change Reference"
    description: >
      Typed reference to an Estate Change entity. The optional trailing
      letter addresses one member of a change family, so a reference can
      name either the family parent or a single member of it.
    pattern: "^([a-z][a-z0-9-]*\\.)?ECH\\d{3,}[a-z]?$"
    examples: ["ECH015", "ECH009a"]

