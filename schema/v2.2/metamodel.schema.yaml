    description: "Typed reference to a Network Link entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?NL\\d{3,}$"
    examples: ["NL001"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Entity Reference Types — Nature
  # ═══════════════════════════════════════════════════════════════════════════

  specimen_ref:
    type: string
