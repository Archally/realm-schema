    pattern: "^([a-z][a-z0-9-]*\\.)?NN\\d{3,}$"
    examples: ["NN001"]

  iot_device_ref:
    type: string
    title: "IoT Device Reference"
    description: "Typed reference to an IoT Device entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?IOT\\d{3,}$"
    examples: ["IOT001"]

  network_link_ref:
    type: string
