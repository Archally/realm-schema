  wing_ref:
    type: string
    title: "Wing Reference"
    description: "Typed reference to a structural wing of a building (v2.0)."
    pattern: "^([a-z][a-z0-9-]*\\.)?WNG\\d{3,}$"
    examples: ["WNG001", "main.WNG001"]

  wall_segment_ref:
    type: string
    title: "Wall Segment Reference"
    description: "Typed reference to a wall segment in the construction layer (v2.0)."
    pattern: "^([a-z][a-z0-9-]*\\.)?WSG\\d{3,}$"
    examples: ["WSG001"]

  slab_ref:
    type: string
    title: "Floor Slab Reference"
    description: "Typed reference to a floor/ceiling slab in the construction layer (v2.0)."
    pattern: "^([a-z][a-z0-9-]*\\.)?SLB\\d{3,}$"
    examples: ["SLB001"]

  roof_plane_ref:
    type: string
    title: "Roof Plane Reference"
    description: "Typed reference to a roof plane in the construction layer (v2.0)."
    pattern: "^([a-z][a-z0-9-]*\\.)?RFP\\d{3,}$"
