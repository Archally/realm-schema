    pattern: "^([a-z][a-z0-9-]*\\.)?EVT\\d{3,}$"
    examples: ["EVT001", "EVT042"]

  estate_change_ref:
    type: string
    title: "Estate Change Reference"
    description: >
      Typed reference to an Estate Change entity. The optional trailing
      letter addresses one member of a change family, so a reference can
      name either the family parent or a single member of it.
    pattern: "^([a-z][a-z0-9-]*\\.)?ECH\\d{3,}[a-z]?$"
    examples: ["ECH015", "ECH009a"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Entity Reference Types — Infrastructure
  # ═══════════════════════════════════════════════════════════════════════════

  system_ref:
    type: string
    title: "System Reference"
    description: "Typed reference to an infrastructure System entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?SYS\\d{3,}$"
    examples: ["SYS001", "heating.SYS001"]

  component_ref:
    type: string
    title: "Component Reference"
    description: "Typed reference to a Component entity within a system."
    pattern: "^([a-z][a-z0-9-]*\\.)?CMP\\d{3,}$"
    examples: ["CMP001", "boiler.CMP003"]

  utility_connection_ref:
    type: string
