    pattern: "^([a-z][a-z0-9-]*\\.)?BLD\\d{3,}$"
    examples: ["BLD001", "east-wing.BLD002"]

  floor_ref:
    type: string
    title: "Floor Reference"
    description: "Typed reference to a Floor entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?FLR\\d{3,}$"
    examples: ["FLR001", "main-house.FLR002"]

  room_ref:
    type: string
