    examples: ["REC001"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Entity Reference Types — Operations
  # ═══════════════════════════════════════════════════════════════════════════

  maintenance_task_ref:
    type: string
    title: "Maintenance Task Reference"
    description: "Typed reference to a Maintenance Task entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?MT\\d{3,}$"
    examples: ["MT001"]

  notification_rule_ref:
    type: string
    title: "Notification Rule Reference"
    description: "Typed reference to a Notification Rule entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?NR\\d{3,}$"
    examples: ["NR001"]

  cost_category_ref:
    type: string
    title: "Cost Category Reference"
    description: "Typed reference to a Cost Category entity."
    pattern: "^([a-z][a-z0-9-]*\\.)?CC\\d{3,}$"
    examples: ["CC001"]

