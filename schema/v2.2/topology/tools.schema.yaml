---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "topology/tools.schema.yaml"
title: "Portable Tools"
description: >
  Portable, hand-held, or easily transportable tools used for property
  maintenance, garden work, and construction. Distinct from equipment
  (EQP) which covers heavier, installed, or hard-to-move items. Each
  tool is a first-class entity with typed ID and storage location.
  Topology plane.

x-gdsm:
  version: "2.2.0"
  methodology: "GDSM v1.0"
  plane: "topology"
  domain_slice: null
  designed_for:
    - id: T2
      name: "Property Inventory Report"
      mfs_target: 85
    - id: T8
      name: "Estate Change Planning Report"
      mfs_target: 80
  competency_questions:
    - "CQ31: What portable tools are available on-site, where are they stored, and which estate changes require them?"
  fitness:
    last_evaluated: "2026-03-14"
    scores: {}
  non_goals:
    - "Tool rental scheduling and logistics"
    - "Tool purchase price history"
    - "Power tool certification and safety training records"
  status: draft
  owned_by: null
  schema_ref_prefix: "TL"

type: object
additionalProperties: false
properties:
  tools:
    type: array
    title: "Tools"
    description: "Portable tools available on the property. Answers CQ31."
    items:
      $ref: "#/$defs/tool"

$defs:
  tool:
    type: object
    title: "Tool"
    description: >
      A portable, hand-held, or easily transportable tool: shovels,
      rakes, saws, welders, ladders, etc. Lighter and more mobile than
      equipment (EQP). Tracks storage location and condition.
      Answers CQ31. Used by T2 (inventory) and T8 (estate change checklist).
    required: [id, name]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "TL### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?TL\\d{3,}$"
        examples: ["TL001"]
      name:
        type: string
        title: "Tool Name"
        minLength: 1
        examples: ["Łopata ogrodowa", "Spawarka MIG/MAG", "Drabina aluminiowa 3 m"]
      tool_type:
        type: string
        title: "Tool Type"
        description: "Free-text classification of this tool (e.g., shovel, welder, ladder)."
        examples: ["shovel", "welder", "ladder", "rake", "pruning-shears"]
      room_ref:
        $ref: "../metamodel.schema.yaml#/$defs/room_ref"
        title: "Storage Room"
        description: "Room where this tool is stored."
      building_ref:
        $ref: "../metamodel.schema.yaml#/$defs/building_ref"
        title: "Storage Building"
        description: >
          Building (shed, garage) where this tool is stored. Use when the
          storage location has no formal rooms.
      brand:
        type: string
        title: "Brand"
        examples: ["Fiskars", "Bosch", "Stanley"]
      model:
        type: string
        title: "Model"
        examples: ["Xact L", "GWS 750-125"]
      condition:
        type: string
        title: "Condition"
        description: "Current physical condition of the tool."
        enum:
          - "good"
          - "fair"
          - "poor"
          - "needs-repair"
      description:
        type: string
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"
