---
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "topology/construction.schema.yaml"
title: "Construction Geometry"
description: >
  AI-agent-generated construction geometry layer. Defines wall segments,
  floor slabs, roof planes, and building shells as first-class entities
  with 3D coordinates. Derived from semantic estate descriptions by an
  AI agent; authoritative for 2D floor plan and 3D rendering. One file
  per floor (FLR###.yaml) or per simple building (BLD###.yaml).

x-gdsm:
  version: "2.1.0"
  methodology: "GDSM v1.0"
  plane: "topology"
  domain_slice: null
  designed_for:
    - id: T5
      name: "2D Spatial Layout Visualization"
      mfs_target: 80
  competency_questions:
    - "CQ33: What is the wall structure (thickness, material, adjacency) of each room?"
    - "CQ34: What are the building heights (eave, ridge) for shadow and elevation analysis?"
  fitness:
    last_evaluated: "2026-03-22"
    scores: {}
  non_goals:
    - "Structural engineering calculations (load, moment, shear)"
    - "Thermal bridging analysis"
    - "MEP (mechanical, electrical, plumbing) routing"
  status: draft
  owned_by: null
  schema_ref_prefix: "WSG, SLB, RFP"
  design_notes: >
    Construction entities are derived, not authored. The AI agent reads
    semantic descriptions (rooms, buildings, openings) and produces
    deterministic geometry. Humans review and optionally correct.
    Renderers consume construction data, not semantic descriptions.
    IFC analogies: WSG ≈ IfcWall, SLB ≈ IfcSlab, RFP ≈ IfcRoof.

type: object
required: [generated_from]
additionalProperties: false
properties:
  floor_ref:
    $ref: "../metamodel.schema.yaml#/$defs/floor_ref"
    title: "Source Floor"
    description: >
      Floor this construction file describes. Required for buildings
      with formal floor entities. Mutually exclusive with building_ref.

  building_ref:
    $ref: "../metamodel.schema.yaml#/$defs/building_ref"
    title: "Source Building"
    description: >
      Building this construction file describes. Used only for simple
      buildings without formal floor entities (sheds, gazebos).
      Mutually exclusive with floor_ref.

  generated_from:
    $ref: "#/$defs/provenance"
    title: "Generation Provenance"

  wall_segments:
    type: array
    title: "Wall Segments"
    description: >
      Wall segments for this floor. Optional for open structures
      (carports, pergolas) that have no walls.
    items:
      $ref: "#/$defs/wall_segment"

  floor_slab:
    $ref: "#/$defs/floor_slab"
    title: "Floor Slab"
    description: "The structural slab for this floor level."

  ceiling_slab:
    $ref: "#/$defs/floor_slab"
    title: "Ceiling Slab"
    description: >
      The ceiling/upper slab for this floor. May be the same as the
      next floor's floor_slab. Omit for top floor (roof takes over).

  roof_planes:
    type: array
    title: "Roof Planes"
    description: >
      Roof planes for this floor. Only present on the topmost floor
      file (or on BLD-level files for flat-roof buildings).
    items:
      $ref: "#/$defs/roof_plane"

  building_shell:
    $ref: "#/$defs/building_shell"
    title: "Building Shell"
    description: "Simplified building envelope for LOD0/LOD1 rendering."

$defs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Provenance
  # ═══════════════════════════════════════════════════════════════════════════

  provenance:
    type: object
    title: "Generation Provenance"
    description: "Tracks how this construction geometry was generated."
    required: [semantic_source_refs, schema_version, generated_at]
    additionalProperties: false
    properties:
      semantic_source_refs:
        type: array
        title: "Source Files"
        description: "Semantic YAML files used as input for generation."
        items:
          type: string
        minItems: 1
        examples: [["topology/estate.yaml", "topology/boundary.yaml"]]
      schema_version:
        type: string
        title: "Schema Version Used"
        examples: ["2.0.0"]
      generated_at:
        type: string
        format: date-time
        title: "Generation Timestamp"
      generator:
        type: string
        title: "Generator"
        description: "Tool or agent that produced this file."
        examples: ["realm-modeler-v2", "manual"]
      human_edited:
        type: boolean
        title: "Human Edited"
        description: "True if a human has modified the generated output."
        default: false
      inference_log:
        type: object
        title: "Inference Statistics"
        description: "Statistics from the AI agent's generation run."
        additionalProperties: true
        properties:
          rooms_processed:
            type: integer
          walls_generated:
            type: integer
          walls_merged:
            type: integer
          openings_mapped:
            type: integer
          warnings:
            type: array
            items:
              type: string

  # ═══════════════════════════════════════════════════════════════════════════
  # Wall Segment — WSG###
  # ═══════════════════════════════════════════════════════════════════════════

  wall_segment:
    type: object
    title: "Wall Segment"
    description: >
      A continuous section of wall with uniform thickness and material.
      Defined by start and end points in model coordinates (meters).
      References the rooms/zones on each side. Carries opening cutout
      positions. Generated from room walls{N,E,S,W} descriptions.
    required: [id, start, end, thickness_cm, is_exterior]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "WSG### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?WSG\\d{3,}$"
        examples: ["WSG001", "main.WSG001"]

      # ── Geometry ──
      start:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "Start Point"
        description: "Start of the wall centerline in model coordinates (meters)."
      end:
        $ref: "../metamodel.schema.yaml#/$defs/position"
        title: "End Point"
        description: "End of the wall centerline in model coordinates (meters)."
      base_elevation_m:
        type: number
        title: "Base Elevation (m)"
        description: "Bottom of the wall above vertical datum."
        default: 0
      height_m:
        type: number
        title: "Wall Height (m)"
        description: "Floor-to-ceiling height of this wall segment."
        exclusiveMinimum: 0
        examples: [2.6, 2.8]
      thickness_cm:
        type: number
        title: "Wall Thickness (cm)"
        exclusiveMinimum: 0
        examples: [24, 12, 15]
      gable_peak_elevation_m:
        type: number
        title: "Gable Peak Elevation (m)"
        description: "Elevation of the gable peak for triangular wall tops."

      # ── Classification ──
      is_exterior:
        type: boolean
        title: "Exterior Wall"
        description: "True if this wall faces outside the building envelope."
      wall_type:
        type: string
        title: "Wall Type"
        enum: ["exterior", "interior-load-bearing", "interior-partition"]
        examples: ["exterior"]
      material:
        type: string
        title: "Material"
        examples: ["gazobeton", "karton-gips", "beton", "cegła"]

      # ── Adjacency ──
      left_space_ref:
        $ref: "../metamodel.schema.yaml#/$defs/room_or_zone_ref"
        title: "Left Space"
        description: >
          Room or outdoor zone on the left side of the wall (when looking
          from start to end).
      right_space_ref:
        $ref: "../metamodel.schema.yaml#/$defs/room_or_zone_ref"
        title: "Right Space"
        description: "Room or outdoor zone on the right side."

      # ── Floor association ──
      floor_ref:
        $ref: "../metamodel.schema.yaml#/$defs/floor_ref"
        title: "Floor"
        description: "Floor this wall segment belongs to."

      # ── Openings ──
      openings:
        type: array
        title: "Opening Cutouts"
        description: "Windows and doors placed on this wall segment."
        items:
          $ref: "#/$defs/wall_opening"

      # ── Wing ──
      wing_ref:
        $ref: "../metamodel.schema.yaml#/$defs/wing_ref"
        title: "Wing"
        description: "Structural wing this wall segment belongs to."

      # ── Provenance ──
      derived_from:
        type: string
        title: "Source"
        description: "Which semantic wall this was derived from (e.g., 'RM001.walls.E')."
        examples: ["RM001.walls.E", "RM003.walls.N + RM004.walls.S"]

      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Wall Opening (embedded on wall_segment)
  # ═══════════════════════════════════════════════════════════════════════════

  wall_opening:
    type: object
    title: "Wall Opening"
    description: >
      A window, door, or other opening placed on a wall segment.
      Position is measured along the wall from start point.
    required: [opening_type, offset_from_start_cm, width_cm, height_cm]
    additionalProperties: false
    properties:
      opening_type:
        type: string
        title: "Opening Type"
        enum:
          - "window"
          - "door"
          - "terrace-door"
          - "french-door"
          - "sliding-door"
          - "skylight"
          - "garage-door"
      offset_from_start_cm:
        type: number
        title: "Offset from Wall Start (cm)"
        description: "Distance from wall segment start to the opening's near edge."
        minimum: 0
      width_cm:
        type: number
        title: "Width (cm)"
        exclusiveMinimum: 0
      height_cm:
        type: number
        title: "Height (cm)"
        exclusiveMinimum: 0
      sill_height_cm:
        type: number
        title: "Sill Height (cm)"
        minimum: 0
        default: 0
      head_height_cm:
        type: number
        title: "Head Height (cm)"
        exclusiveMinimum: 0
      depth_cm:
        type: number
        title: "Reveal Depth (cm)"
        exclusiveMinimum: 0
      swing_direction:
        type: string
        title: "Swing Direction"
        enum: ["left", "right"]
      opens_inward:
        type: boolean
        title: "Opens Inward"
      glazing:
        type: string
        title: "Glazing Type"
        enum: ["single", "double", "triple"]
      connects_to_ref:
        title: "Connects To"
        description: "Room or zone on the other side of this opening; null if it connects to the exterior."
        anyOf:
          - $ref: "../metamodel.schema.yaml#/$defs/room_or_zone_ref"
          - type: "null"
      source_room_ref:
        $ref: "../metamodel.schema.yaml#/$defs/room_ref"
        title: "Source Room"
        description: "Room whose semantic opening definition this was derived from."

  # ═══════════════════════════════════════════════════════════════════════════
  # Floor Slab — SLB###
  # ═══════════════════════════════════════════════════════════════════════════

  floor_slab:
    type: object
    title: "Floor Slab"
    description: >
      A horizontal structural element (floor or ceiling slab). Defined by
      a polygon outline at a specific elevation. Used for 3D floor/ceiling
      rendering and room volume computation.
    required: [id, floor_ref, outline, elevation_m, thickness_cm]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "SLB### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?SLB\\d{3,}$"
        examples: ["SLB001", "main.SLB001"]
      floor_ref:
        $ref: "../metamodel.schema.yaml#/$defs/floor_ref"
        title: "Floor"
        description: "Floor this slab belongs to."
      outline:
        $ref: "../metamodel.schema.yaml#/$defs/polygon_footprint"
        title: "Slab Outline"
        description: "Plan-view polygon of this slab in model coordinates."
      elevation_m:
        type: number
        title: "Top Surface Elevation (m)"
        description: "Elevation of the finished floor surface above vertical datum."
      thickness_cm:
        type: number
        title: "Slab Thickness (cm)"
        exclusiveMinimum: 0
        examples: [20, 25, 30]
      slab_type:
        type: string
        title: "Slab Type"
        enum: ["ground-floor", "intermediate", "roof-slab", "basement"]
      material:
        type: string
        title: "Material"
        examples: ["reinforced-concrete", "timber-joist", "steel-composite"]
      derived_from:
        type: string
        title: "Source"
        examples: ["FLR001 + BLD001.footprint"]
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Roof Plane — RFP###
  # ═══════════════════════════════════════════════════════════════════════════

  roof_plane:
    type: object
    title: "Roof Plane"
    description: >
      A planar surface of the roof. A gable roof has 2 planes; a hip roof
      has 4. Each plane is a 3D polygon defining the visible roof surface.
      Generated from building roof metadata (type, pitch, ridge_direction).
    required: [id, building_ref, vertices_3d, surface_type]
    additionalProperties: false
    properties:
      id:
        type: string
        title: "RFP### Identifier"
        pattern: "^([a-z][a-z0-9-]*\\.)?RFP\\d{3,}$"
        examples: ["RFP001", "main.RFP001"]
      building_ref:
        $ref: "../metamodel.schema.yaml#/$defs/building_ref"
        title: "Building"
        description: "Building this roof plane covers."
      wing_ref:
        $ref: "../metamodel.schema.yaml#/$defs/wing_ref"
        title: "Wing"
        description: "Wing this roof plane covers. Required when building has wings."
      vertices_3d:
        type: array
        title: "3D Vertices"
        description: >
          Ordered vertices of this roof plane in model coordinates with
          elevation. CCW winding viewed from above.
        minItems: 3
        items:
          $ref: "../metamodel.schema.yaml#/$defs/position3d"
      surface_type:
        type: string
        title: "Surface Type"
        enum: ["slope", "ridge-cap", "flat", "dormer-slope", "dormer-face"]
      pitch_degrees:
        type: number
        title: "Pitch (degrees)"
        minimum: 0
        maximum: 90
      facing_direction:
        $ref: "../metamodel.schema.yaml#/$defs/compass_direction"
        title: "Facing Direction"
        description: "Compass direction the slope faces (down-slope direction)."
      material:
        type: string
        title: "Roof Material"
        examples: ["tile-concrete", "tile-ceramic", "metal-standing-seam", "bitumen", "slate"]
      overhang_cm:
        type: number
        title: "Overhang (cm)"
        minimum: 0
      has_pv_panels:
        type: boolean
        title: "Has PV Panels"
        description: "Whether photovoltaic panels are mounted on this plane."
      derived_from:
        type: string
        title: "Source"
        examples: ["BLD001 (gable, pitch=35, ridge=E)"]
      tags:
        $ref: "../metamodel.schema.yaml#/$defs/tags"

  # ═══════════════════════════════════════════════════════════════════════════
  # Building Shell (LOD0/LOD1)
  # ═══════════════════════════════════════════════════════════════════════════

  building_shell:
    type: object
    title: "Building Shell"
    description: >
      Simplified building envelope for LOD0 (footprint) and LOD1 (extruded
      block) rendering. Pre-computed from footprint + heights for fast 3D.
    required: [footprint_absolute]
    additionalProperties: false
    properties:
      footprint_absolute:
        $ref: "../metamodel.schema.yaml#/$defs/polygon_footprint"
        title: "Absolute Footprint"
        description: "Building footprint in model coordinates (rotation applied)."
      ground_elevation_m:
        type: number
        title: "Ground Elevation (m)"
      eave_elevation_m:
        type: number
        title: "Eave Elevation (m)"
      ridge_elevation_m:
        type: number
        title: "Ridge Elevation (m)"
