name: Validate & Test
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Every schema file parses as YAML
        run: |
          node --input-type=module -e "
          import {readFileSync, globSync} from 'node:fs';
          import {parse} from 'yaml';
          const files = globSync('schema/*/**/*.yaml');
          if (files.length === 0) { console.error('no schema files found'); process.exit(1); }
          let failed = 0;
          for (const file of files) {
            try { parse(readFileSync(file, 'utf8')); }
            catch (error) { console.error('PARSE FAIL ' + file + ': ' + error.message); failed++; }
          }
          console.log(files.length - failed + '/' + files.length + ' schema file(s) parse');
          process.exit(failed === 0 ? 0 : 1);
          "
      - name: The example model validates
        run: npm run validate:examples

      - name: The model-quality rules run on the example
        # Reports rather than gates: these rules gather findings about what the schema
        # deliberately leaves optional, so a finding is a judgement about a model and not
        # a defect in it. What this step asserts is only that the checker RUNS.
        run: npm run check:examples

      - name: The rule pack actually loaded, and the graph under it is not empty
        # The step above exits 0 both when every rule passed and when NO RULE WAS LOADED:
        # an empty pack prints "No findings." and exits 0, which is byte for byte what a
        # flawless model produces. So the COUNTS are asserted rather than the verdict -
        # how many rules ran, and how many entities they ran over.
        run: |
          node tools/semantic-checker/cli.mjs --model examples/willow-cottage/.realm/v2.2 --json > /tmp/quality.json || true
          node --input-type=module -e "
          import {readFileSync} from 'node:fs';
          const report = JSON.parse(readFileSync('/tmp/quality.json', 'utf8'));
          if (!(report.rules > 0)) { console.error('FAIL: the rule pack loaded 0 rules'); process.exit(1); }
          if (!(report.entities > 0)) { console.error('FAIL: the model has 0 entities'); process.exit(1); }
          console.log(report.rules + ' rule(s) ran over ' + report.entities + ' entities and ' + report.relations + ' relations');
          "

      - name: The model builder emits a graph, not an empty document
        # Every other tool reads this graph, so its failures are silent by nature - a
        # dropped entity or an unplaced plane produces a smaller model rather than an error.
        run: |
          node tools/model-builder/cli.mjs examples/willow-cottage --output /tmp/model.json
          node --input-type=module -e "
          import {readFileSync} from 'node:fs';
          const model = JSON.parse(readFileSync('/tmp/model.json', 'utf8'));
          for (const [name, value] of [['entities', model.entities.length], ['relations', model.relations.length], ['planes', model.planes.length]]) {
            if (!(value > 0)) { console.error('FAIL: the built model has 0 ' + name); process.exit(1); }
          }
          if (!model.realm?.name) { console.error('FAIL: the built model does not name the property'); process.exit(1); }
          console.log(model.entities.length + ' entities, ' + model.relations.length + ' relations, ' + model.planes.length + ' planes, for ' + model.realm.name);
          "

      - name: The YAML in the guides validates
        # A worked example in a guide is the shape a reader copies. When the schema moves and
        # the guide does not, the documentation starts teaching a model the validator rejects,
        # and nothing notices, because no validator has ever been pointed at a markdown file.
        run: npm run doc-snippets

      - name: A guide with a seeded bad example is rejected
        # Same reasoning as the seeded model above. This gate reports OK both when every
        # example is valid and when it found no example to check, so the run has to prove
        # it can still say no.
        run: |
          cp docs/file-conventions.md /tmp/seeded-guide.md
          node --input-type=module -e "
          import {readFileSync, writeFileSync} from 'node:fs';
          const text = readFileSync('/tmp/seeded-guide.md', 'utf8').replace('area_sqm:', 'area_sqm_typo:');
          writeFileSync('/tmp/seeded-guide.md', text);
          "
          if node tools/doc-snippet-validate/cli.mjs /tmp/seeded-guide.md --schemas schema/v2.2 \
               --validator "node tools/validator/src/cli.mjs --model {model} --schemas {schemas}"; then
            echo "FAIL: the guide gate accepted a block with an undefined field"
            exit 1
          fi
          echo "OK: the seeded bad example was rejected"
      - name: A model with a seeded fault is rejected
        # Without this, the step above proves only that the validator exits 0 - which it
        # would also do if it had stopped checking anything. Breaking a reference the
        # schema requires must produce a non-zero exit.
        run: |
          cp -r examples/willow-cottage/.realm/v2.2 /tmp/seeded
          node --input-type=module -e "
          import {readFileSync, writeFileSync} from 'node:fs';
          const path = '/tmp/seeded/topology/estate.yaml';
          const text = readFileSync(path, 'utf8').replace('room_type: kitchen', 'room_type: dungeon');
          writeFileSync(path, text);
          "
          if node tools/validator/src/cli.mjs --model /tmp/seeded --schemas schema/v2.2; then
            echo "FAIL: the validator accepted a model with an invalid room_type"
            exit 1
          fi
          echo "OK: the seeded fault was rejected"

      - name: The rendered documents still describe the model beside them
        # Two documents are committed under examples/willow-cottage/.specs/, and a document
        # that has stopped describing its model is worse than none because it is read as
        # current. Rendering reads no clock, so re-rendering an unchanged model produces the
        # same bytes and a difference is always drift.
        run: npm run render:check

      - name: A document that stopped describing its model is rejected
        # Without this, the step above proves only that the renderer exits 0 - which it
        # would also do if --check had stopped comparing anything.
        run: |
          cp -r examples/willow-cottage /tmp/seeded-render
          node --input-type=module -e "
          import {readFileSync, writeFileSync} from 'node:fs';
          const path = '/tmp/seeded-render/.specs/property.md';
          writeFileSync(path, readFileSync(path, 'utf8').replace('## Grounds', '## Grounds, allegedly'));
          "
          if node tools/renderer/cli.mjs /tmp/seeded-render --document all -o /tmp/seeded-render/.specs --check; then
            echo "FAIL: --check accepted a document the model does not produce"
            exit 1
          fi
          echo "OK: the stale document was rejected"
